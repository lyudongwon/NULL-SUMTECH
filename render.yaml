# Render Blueprint: 화면(app)·백엔드(api)·DB를 한 번에 만든다. Render 대시보드 → New → Blueprint에서 이 레포를 고른다.
# docker-compose.yml과 같은 Dockerfile을 쓴다. 채점은 docker compose로 띄운 앱을 보고, 이 배포는 발표와 대시보드 UP 표시에 쓴다.
# 무료 등급: 15분 동안 요청이 없으면 잠들고 깨는 데 1분쯤 걸린다. 무료 Postgres는 만든 뒤 30일이 지나면 만료된다.
databases:
  - name: null-sumtech-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: foodcheck
    user: foodcheck

services:
  # 화면(Next.js). 공개 주소이자 대시보드에 등록하는 배포 URL이다.
  - type: web
    name: null-sumtech
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # /__health는 RENDER_GIT_COMMIT(배포한 commit)을 releaseId로 돌려준다.
    healthCheckPath: /__health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "3000"
      # 백엔드의 공개 주소(https://...onrender.com). 무료 웹 서비스는 내부 네트워크로 요청을 받을 수 없어서 공개 주소로 부른다.
      - key: BACKEND_URL
        sync: false

  # 백엔드(Spring Boot). 화면이 /api/v1/**을 이 서비스로 넘긴다.
  - type: web
    name: null-sumtech-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /__health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "8080"
      # postgresql://... 형식이라 백엔드가 시작할 때 JDBC 설정으로 바꾼다(global/config/DatabaseUrl).
      - key: DATABASE_URL
        fromDatabase:
          name: null-sumtech-db
          property: connectionString
      - key: AI_GATEWAY_API_KEY
        sync: false
      # Render는 HTTPS로만 받으니 로그인 쿠키에 Secure를 붙인다(application.yml app.auth.cookie-secure).
      - key: AUTH_COOKIE_SECURE
        value: "true"
