# app(화면, Next.js)만 3000 포트를 연다. 백엔드와 DB는 내부 네트워크로만 쓴다.
# app은 루트 Dockerfile로 빌드한다(제출 요건: docker-compose.yml과 같은 위치의 Dockerfile).
# 주최 측 실행·CI는 RELEASE_ID에 실행하는 commit SHA를 넣고, /__health가 그 값을 releaseId로 돌려준다.
services:
  app:
    build:
      context: .
      args:
        RELEASE_ID: ${RELEASE_ID:-dev}
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8080
      RELEASE_ID: ${RELEASE_ID:-dev}
      KAKAO_MAP_APP_KEY: ${KAKAO_MAP_APP_KEY:-}
      # 화면은 AI를 직접 부르지 않지만, 제출 요건이 app 환경변수로 받으라고 해서 함께 둔다. 실제 호출은 backend가 한다.
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/foodcheck
      SPRING_DATASOURCE_USERNAME: foodcheck
      SPRING_DATASOURCE_PASSWORD: foodcheck
      RELEASE_ID: local
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-https://ai-gateway.vercel.sh/v1}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      NEARBY_DEFAULT_LAT: ${NEARBY_DEFAULT_LAT:-}
      NEARBY_DEFAULT_LNG: ${NEARBY_DEFAULT_LNG:-}
      NEARBY_RADIUS_M: ${NEARBY_RADIUS_M:-1000}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foodcheck
      POSTGRES_USER: foodcheck
      POSTGRES_PASSWORD: foodcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodcheck -d foodcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
