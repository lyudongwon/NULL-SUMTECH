# NULL 팀 사용자 핵심 흐름. 2026-10-29 학생이 채팅으로 설명한 화면 흐름을 옮김.
# steps는 화면의 메뉴·버튼 이름으로 한 줄에 한 동작. 버튼 이름은 실제 화면을 만들면 그 이름에 맞춰 고친다.
# 흐름마다 앞 흐름이 만든 데이터에 기대지 않도록 첫 화면(언어 선택)부터 시작한다.
# 고른 언어로 화면이 바뀌므로, 버튼 이름을 고정하려고 1번 흐름 말고는 "한국어"로 진행한다.
# 웹 서비스로 만든다. "사진 찍기"는 브라우저의 사진 선택 칸(휴대폰에서는 카메라가 열림)으로, E2E에서는 fixtures 사진을 올린다.

platform: mobile
platformReason: |-
  웹 서비스지만 학식당에서 메뉴를 고르는 그 자리에서 휴대폰 브라우저로 열어,
  휴대폰 카메라로 음식이나 메뉴판을 찍어 확인하고,
  주의가 필요하면 휴대폰 화면의 한국어 질문 카드를 점원에게 그대로 보여 주기 때문이다.

login: false # 로그인 없이 언어·식단 제한 설정을 브라우저에 저장한다고 가정(팀 확인 필요)

scenarios:
  - id: onboarding-language
    title: 첫 화면에서 언어를 고르면 앱 화면이 그 언어로 바뀐다
    steps:
      - 첫 화면(언어 선택)을 연다
      - 언어 목록에서 "English"를 누른다
      - '"Next" 버튼을 누른다 (English를 고르면 버튼도 영어로 바뀜)'
    expected:
      - 식단 제한 선택 화면이 영어로 표시된다
      - 큰 카테고리 4개(Religion, Vegetarian, Allergy, Other)가 보인다

  - id: onboarding-dietary-restrictions
    title: 카테고리별 세부 항목을 골라 내 식단 제한을 저장한다
    steps:
      - 첫 화면(언어 선택)에서 "한국어"를 누른다
      - '"다음" 버튼을 누른다'
      - '"종교" 카테고리를 누른다'
      - 펼쳐진 세부 항목에서 "이슬람교"를 고른다
      - '"채식" 카테고리를 누른다'
      - 펼쳐진 세부 항목에서 "락토 베지테리언"을 고른다
      - '"알레르기" 카테고리를 누른다'
      - 펼쳐진 세부 항목에서 "땅콩"을 고른다
      - '"기타" 카테고리를 누른다'
      - 펼쳐진 세부 항목에서 "고수"를 고른다
      - '"완료" 버튼을 누른다'
    expected:
      - 홈 화면으로 이동한다
      - 홈 화면에 "사진으로 확인하기", "오늘의 학식", "나와 비슷한 사용자의 추천 음식"이 보인다
      - 내 식단 제한에 이슬람교, 락토 베지테리언, 땅콩, 고수가 저장돼 있다

  - id: check-food-photo-forbidden
    title: 사진을 찍어 먹으면 안 되는 음식임을 확인한다
    steps:
      - 첫 화면(언어 선택)에서 "한국어"를 누르고 "다음"을 누른다
      - '"종교" 카테고리에서 "이슬람교"를 고르고 "완료"를 누른다'
      - 홈 화면에서 "사진으로 확인하기"를 누른다
      - '"사진 찍기"를 누르고 제육볶음 사진(e2e/fixtures/jeyuk-bokkeum.jpg)을 올린다'
      - 음식 확인 화면에서 "맞아요" 버튼을 누른다
    expected:
      - 음식 확인 화면에 메뉴 이름 "제육볶음"과 관련 사진들이 보인다
      - 판정 화면에 "먹으면 안 돼요"가 표시된다
      - 이유로 돼지고기가 들어간다는 내용이 보인다

  - id: check-food-photo-caution-question-card
    title: 레시피에 따라 다른 음식은 주의 판정과 한국어 질문 카드를 보여 준다
    steps:
      - 첫 화면(언어 선택)에서 "한국어"를 누르고 "다음"을 누른다
      - '"종교" 카테고리에서 "이슬람교"를 고르고 "완료"를 누른다'
      - 홈 화면에서 "사진으로 확인하기"를 누른다
      - '"사진 찍기"를 누르고 김치찌개 사진(e2e/fixtures/kimchi-jjigae.jpg)을 올린다'
      - 음식 확인 화면에서 "맞아요" 버튼을 누른다
      - 판정 화면에서 "점원에게 물어보기" 버튼을 누른다
    expected:
      - 판정 화면에 "주의가 필요해요"와, 돼지고기가 들어가는 레시피와 안 들어가는 레시피가 있다는 설명이 보인다
      - 화면에 한국어 질문 카드가 크게 뜨고, 카드에 "돼지고기"가 들어간 질문 문장이 보인다

  - id: check-food-menu-name-safe
    title: 메뉴 이름을 입력해 먹어도 되는 음식임을 확인한다
    steps:
      - 첫 화면(언어 선택)에서 "한국어"를 누르고 "다음"을 누른다
      - '"알레르기" 카테고리에서 "땅콩"을 고르고 "완료"를 누른다'
      - 홈 화면에서 "메뉴 이름으로 확인하기"를 누른다
      - 입력칸에 "흰쌀밥"을 입력한다
      - '"확인" 버튼을 누른다'
      - 음식 확인 화면에서 "맞아요" 버튼을 누른다
    expected:
      - 음식 확인 화면에 메뉴 이름 "흰쌀밥"과 관련 사진들이 보인다
      - 판정 화면에 "먹어도 돼요"가 표시된다

  - id: check-food-wrong-recognition-retake
    title: 인식된 음식이 아니면 사진을 다시 찍는다
    steps:
      - 첫 화면(언어 선택)에서 "한국어"를 누르고 "다음"을 누른다
      - '"종교" 카테고리에서 "이슬람교"를 고르고 "완료"를 누른다'
      - 홈 화면에서 "사진으로 확인하기"를 누른다
      - '"사진 찍기"를 누르고 김치찌개 사진(e2e/fixtures/kimchi-jjigae.jpg)을 올린다'
      - 음식 확인 화면에서 "아니에요" 버튼을 누른다
    expected:
      - 판정 화면으로 넘어가지 않는다
      - 사진 찍기 화면으로 돌아가고 "다시 찍어 주세요" 안내와 "사진 찍기" 버튼이 보인다

  - id: home-today-cafeteria-menu
    title: 홈에서 오늘의 학식 정보를 본다
    steps:
      - 첫 화면(언어 선택)에서 "한국어"를 누르고 "다음"을 누른다
      - '"종교" 카테고리에서 "이슬람교"를 고르고 "완료"를 누른다'
      - 홈 화면에서 "오늘의 학식"을 누른다
    expected:
      - 오늘 날짜와 시드 데이터에 넣은 오늘의 학식 메뉴 목록이 보인다

  - id: home-similar-user-recommendations
    title: 나와 식단 제한이 비슷한 사용자의 추천 음식을 본다
    steps:
      - 첫 화면(언어 선택)에서 "한국어"를 누르고 "다음"을 누른다
      - '"채식" 카테고리에서 "비건"을 고르고 "완료"를 누른다'
      - 홈 화면에서 "나와 비슷한 사용자의 추천 음식"을 누른다
    expected:
      - 비건을 고른 다른 사용자(시드 데이터)가 추천한 음식 목록이 보인다
