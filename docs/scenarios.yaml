# NULL 팀 사용자 핵심 흐름. 2026-10-29 팀 시나리오 문서(노션 "기능 명세서" F1~F8)를 docs/problem.yaml의 REQ·OPT ID로 옮겼다.
# 노션 F번호 → 합의본 ID: F1→REQ-1, F2→OPT-3, F3→REQ-2, F4→REQ-5, F5→REQ-3, F6→REQ-4, F7→OPT-1, F8→OPT-2
# steps는 한 줄에 한 동작씩 화면의 메뉴·버튼 이름으로 적었다. 실제 화면이 나오면 버튼·프리셋·토글 이름을 거기에 맞춘다.
# 화면은 영어(REQ-8)라서 따옴표 안 문구는 docs/api.md > 화면 문구의 영어를 그대로 쓴다. 메뉴·재료 이름만 메뉴판의 한국어 원문으로 확인한다.
# 앞 흐름의 데이터에 기대지 않도록 흐름마다 첫 화면에서 식단 제한부터 정한다.
# 예시 메뉴(설렁탕·콩나물국·그린샐러드·버섯리조또·김치찌개·비빔밥·비빔국수)는 음식 DB 시드에 넣고, E2E는 e2e/fixtures 사진을 올린다.
# DB에 없는 메뉴는 만개의 레시피 → AI 추정 순으로 재료를 찾는다(REQ-5). 그래서 S5(manual-input-unknown-menu)의 "된장찌개"는 시드에 넣지 않는다.
# 만개의 레시피가 막혀도 AI 추정으로 배지가 나오니, 이 흐름은 외부 사이트 상태와 상관없이 통과해야 한다.
# 프리셋 "Vegetarian"(채식)은 고기·해산물만 빼고 계란·유제품은 허용한다(api.md 코드 VEGETARIAN).
# S6(halal-bibimbap-gochujang)은 problem.yaml E1(P1)을, S7(peanut-allergy-bibimguksu)는 E2(P2)를 그대로 재현한다.
# OPT-3(이미지 축소)은 화면 동작이 아니어서 뺐다.
# OPT-2(음식점 추천) 흐름 S8(other-restaurants-halal)은 음식점 이름이 아니라 "제한 항목을 쓰는 음식점은 안 보인다"로 확인한다. 음식점 시드(R__20)가 아직 예시 데이터라, 실제 조사 데이터로 바뀌어도 그대로 통과해야 한다.

platform: mobile
platformReason: |-
  웹 서비스지만 학식당에서 메뉴를 고르는 그 자리에서 휴대폰 브라우저로 연다.
  메뉴판이나 음식을 휴대폰 카메라로 찍어 바로 먹을지 말지 정하기 때문이다.

login: optional # 로그인 없이도 쓴다(서버가 발급한 user_id). 가입·로그인(OPT-4)하면 같은 user_id가 계정에 묶인다

scenarios:
  # scan-menu-board
  - id: S1
    title: 메뉴판 사진을 올리면 메뉴마다 3단계 판정 배지와 근거가 나온다
    features: [REQ-1, REQ-2, REQ-5, REQ-3, REQ-4]
    steps:
      - 첫 화면에서 "Diet settings"를 누른다
      - 프리셋에서 "Vegetarian"을 누른다
      - '"Save"를 누른다'
      - '"Upload photo"를 누르고 메뉴판 사진(e2e/fixtures/menu-board.jpg, 설렁탕·콩나물국·그린샐러드·버섯리조또가 적힘)을 고른다'
    expected:
      - 판정 화면에 메뉴 이름 4개가 각각 보인다
      - 메뉴마다 "Safe", "Check first", "Avoid" 중 하나의 배지와 근거 한 줄이 보인다
      - '"설렁탕"에 "Avoid" 배지와 "소고기"가 들어간다는 영어 근거가 보인다'

  # scan-food-photo-single-dish
  - id: S2
    title: 음식 사진 한 장을 올리면 요리명 1개와 판정, 근거 상세가 나온다
    features: [REQ-1, REQ-2, REQ-5, REQ-3, REQ-4, REQ-6, REQ-7, REQ-8]
    steps:
      - 첫 화면에서 "Diet settings"를 누른다
      - 프리셋에서 "Vegetarian"을 누른다
      - '"Save"를 누른다'
      - '"Upload photo"를 누르고 설렁탕 음식 사진(e2e/fixtures/seolleongtang.jpg)을 고른다'
      - 판정 화면에서 "설렁탕"을 누른다
    expected:
      - 판정 화면에 메뉴가 "설렁탕" 1개만 보인다
      - '"설렁탕"에 "Avoid" 배지와 영어 근거 한 줄이 보인다'
      - 근거 상세에 "소고기"가 "Confirmed"로 표시되고, 확신도와 적용된 규칙(Rule)이 보인다
      - 화면 하단에 "For guidance only. Please make the final check yourself or with a dietitian."이 보인다
      - 버튼·배지·근거가 모두 영어로 보이고, 메뉴 이름은 메뉴판 원문 "설렁탕" 그대로 보인다

  # diet-toggle-only
  - id: S3
    title: 프리셋 없이 토글만으로 식단 제한을 정해 판정받는다
    features: [REQ-3, REQ-4]
    steps:
      - 첫 화면에서 "Diet settings"를 누른다
      - 토글 목록에서 "Meat"를 켠다
      - '"Save"를 누른다'
      - '"Upload photo"를 누르고 설렁탕 음식 사진(e2e/fixtures/seolleongtang.jpg)을 고른다'
    expected:
      - '"Diet settings" 화면에서 "Meat" 토글이 켜져 있다'
      - 판정 화면에 "설렁탕"과 "Avoid" 배지, "소고기"가 들어 있어 Meat 제한에 걸린다는 영어 근거가 보인다

  # manual-input-fallback
  - id: S4
    title: 사진에서 메뉴를 하나도 못 읽으면 이름을 직접 입력해 판정받는다
    features: [REQ-2, REQ-3, OPT-1]
    steps:
      - 첫 화면에서 "Diet settings"를 누른다
      - 프리셋에서 "Halal"을 누른다
      - '"Save"를 누른다'
      - '"Upload photo"를 누르고 메뉴가 없는 사진(e2e/fixtures/no-menu.jpg)을 고른다'
      - 나타난 메뉴 이름 입력칸에 "김치찌개"를 입력한다
      - '"Can I eat it?"을 누른다'
    expected:
      - 사진을 올린 뒤 메뉴 이름 입력칸이 나타난다
      - 판정 화면에 "김치찌개"와 "Safe", "Check first", "Avoid" 중 하나의 배지, 근거 한 줄이 사진 판정과 같은 형식으로 보인다

  # manual-input-unknown-menu
  - id: S5
    title: 음식 DB에 없는 메뉴를 입력하면 만개의 레시피에서 재료를 찾아와 판정한다
    features: [REQ-3, REQ-5, OPT-1]
    steps:
      - 첫 화면에서 "Diet settings"를 누른다
      - 프리셋에서 "Halal"을 누른다
      - '"Save"를 누른다'
      - '"Upload photo"를 누르고 메뉴가 없는 사진(e2e/fixtures/no-menu.jpg)을 고른다'
      - 나타난 메뉴 이름 입력칸에 음식 DB 시드에 없는 메뉴 "된장찌개"를 입력한다
      - '"Can I eat it?"을 누른다'
    expected:
      - 데이터베이스에 없는 메뉴라는 팝업 없이 판정 화면으로 넘어간다
      - 판정 화면에 "된장찌개"와 "Safe", "Check first", "Avoid" 중 하나의 배지, 근거 한 줄이 사진 판정과 같은 형식으로 보인다

  # halal-bibimbap-gochujang
  - id: S6
    title: 할랄 유학생이 비빔밥을 찍으면 고추장 속 돼지고기 가능성 때문에 "Check first"와 근거가 나온다 (E1)
    features: [REQ-1, REQ-2, REQ-3, REQ-4, REQ-5, REQ-6]
    steps:
      - 첫 화면에서 "Diet settings"를 누른다
      - 프리셋에서 "Halal"을 누른다
      - '"Save"를 누른다'
      - '"Upload photo"를 누르고 비빔밥 음식 사진(e2e/fixtures/bibimbap.jpg)을 고른다'
      - 판정 화면에서 "비빔밥"을 누른다
    expected:
      - 판정 화면에 "비빔밥"과 "Check first" 배지, "고추장" 속 "돼지고기"가 들어 있을 수 있다는 영어 근거 한 줄이 보인다
      - 근거 상세에 "고추장" 속 "돼지고기"가 "Estimated"로 표시되고, 확신도와 적용된 규칙(Rule)이 보인다

  # peanut-allergy-bibimguksu
  - id: S7
    title: 땅콩 알레르기 유학생이 비빔국수를 찍으면 양념장 속 땅콩 가능성 때문에 "Check first"와 근거가 나온다 (E2)
    features: [REQ-1, REQ-2, REQ-3, REQ-4, REQ-5, REQ-6]
    steps:
      - 첫 화면에서 "Diet settings"를 누른다
      - 토글 목록에서 "Peanut"을 켠다
      - '"Save"를 누른다'
      - '"Upload photo"를 누르고 비빔국수 음식 사진(e2e/fixtures/bibimguksu.jpg)을 고른다'
      - 판정 화면에서 "비빔국수"를 누른다
    expected:
      - 판정 화면에 "비빔국수"와 "Check first" 배지, "양념장" 속 "땅콩"이 들어 있을 수 있다는 영어 근거 한 줄이 보인다
      - 근거 상세에 "양념장" 속 "땅콩"이 "Estimated"로 표시되고, 확신도와 적용된 규칙(Rule)이 보인다

  # other-restaurants-halal
  - id: S8
    title: 할랄 유학생이 "Other restaurants"를 누르면 돼지고기·술을 쓰지 않는 음식점만 추천된다
    features: [REQ-4, OPT-2]
    steps:
      - 첫 화면에서 "Diet settings"를 누른다
      - 프리셋에서 "Halal"을 누른다
      - '"Save"를 누른다'
      - 첫 화면에서 "Other restaurants"를 누른다
    expected:
      - 음식점 목록이 보이고, 음식점마다 이름과 종류가 보인다
      - 목록에는 돼지고기(Pork)·술(Alcohol)을 쓰지 않는 음식점만 있고, 둘 중 하나라도 쓰는 음식점은 보이지 않는다

  # signup-login-logout
  - id: S9
    title: 가입하면 식단 제한이 계정에 남고, 로그아웃했다가 다시 로그인해도 불러와진다
    features: [OPT-4, REQ-4]
    steps:
      - 첫 화면에서 "Diet settings"를 누른다
      - 프리셋에서 "Halal"을 누른다
      - '"Save"를 누른다'
      - 첫 화면에서 "Sign up"을 누른다
      - 이메일과 8자 이상 비밀번호를 넣고 "Sign up"을 누른다
      - 첫 화면에서 "Log out"을 누른다
      - 첫 화면에서 "Log in"을 누르고 같은 이메일·비밀번호로 "Log in"을 누른다
      - 첫 화면에서 "Diet settings"를 누른다
    expected:
      - 가입하면 첫 화면에 로그인한 이메일과 "Log out"이 보인다
      - 로그아웃하면 첫 화면에 "Log in"과 "Sign up"이 다시 보인다
      - 다시 로그인한 뒤 "Diet settings"에 "Halal"이 선택돼 있다
      - 틀린 비밀번호로 로그인하면 "Incorrect email or password."가 보인다

  # restaurant-feedback-filter
  - id: S10
    title: 로그인한 사용자가 가게에 돼지고기가 쓰인다고 제보하면 할랄 사용자의 추천에서 그 가게가 빠진다
    features: [OPT-5, OPT-2, OPT-4]
    steps:
      - 가입·로그인한 뒤 프리셋 "Halal"을 저장한다
      - 첫 화면에서 "Other restaurants"를 누르고 첫 번째 음식점 이름을 기억한다
      - 그 음식점의 "Report an ingredient"를 누르고 "Pork"를 골라 "Send"를 누른다
      - 첫 화면으로 돌아가 "Other restaurants"를 다시 누른다
    expected:
      - 제보를 보내면 "Thanks! We'll hide this restaurant from people who avoid Pork."가 보인다
      - 다시 연 목록에서 방금 제보한 음식점이 보이지 않는다
      - 로그인하지 않은 상태의 "Other restaurants"에는 "Log in to report an ingredient."가 보인다
