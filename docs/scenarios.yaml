# NULL 팀 사용자 핵심 흐름. 2026-10-29 팀 시나리오 문서(노션 "기능 명세서" F1~F8 기준)를 docs/problem.yaml의 합의된 기능 명세서 ID(REQ·OPT)로 바꿔 옮김.
# 노션 F번호 → 합의본 ID: F1→REQ-1, F2→OPT-3, F3→REQ-2, F4→REQ-5, F5→REQ-3, F6→REQ-4, F7→OPT-1, F8→OPT-2
# steps는 화면의 메뉴·버튼 이름으로 한 줄에 한 동작. 버튼·프리셋·토글 이름은 실제 화면을 만들면 그 이름에 맞춰 고친다.
# 흐름마다 앞 흐름이 만든 데이터에 기대지 않도록 첫 화면에서 식단 제한부터 정한다.
# 예시 메뉴(설렁탕·콩나물국·그린샐러드·버섯리조또·김치찌개)는 음식 DB 시드 데이터에 넣는다. E2E에서는 e2e/fixtures 사진을 올린다.
# 음식 DB에 없는 메뉴는 만개의 레시피에서 재료를 검색해 판정한다(REQ-5). manual-input-unknown-menu의 "된장찌개"는 시드에 넣지 않는다.
# OPT-3(이미지 축소)은 화면 동작이 아니라 흐름에 넣지 않는다. OPT-2(음식점 추천)는 "학식을 이용할 수 없는 경우"의 기준이 없어 흐름이 없다.

platform: mobile
platformReason: |-
  웹 서비스지만 학식당에서 메뉴를 고르는 그 자리에서 휴대폰 브라우저로 열어,
  휴대폰 카메라로 메뉴판이나 음식을 찍어 바로 먹을지 말지 정하기 때문이다.

login: false # 회원·로그인 없이 서버가 Auto Increment로 발급한 user_id로 사용자를 구분한다

scenarios:
  - id: scan-menu-board
    title: 메뉴판 사진을 올리면 메뉴마다 3단계 판정 배지와 근거가 나온다
    features: [REQ-1, REQ-2, REQ-5, REQ-3, REQ-4]
    steps:
      - 첫 화면에서 "식단 제한 설정"을 누른다
      - 프리셋에서 "채식"을 누른다
      - '"저장"을 누른다'
      - '"사진 올리기"를 누르고 메뉴판 사진(e2e/fixtures/menu-board.jpg, 설렁탕·콩나물국·그린샐러드·버섯리조또가 적힘)을 고른다'
    expected:
      - 판정 화면에 메뉴 이름 4개가 각각 보인다
      - 메뉴마다 "안전", "확인 필요", "불가" 중 하나의 배지와 근거 한 줄이 보인다
      - 설렁탕은 "불가" 배지와 고기(소고기)가 들어간다는 근거가 보인다

  - id: scan-food-photo-single-dish
    title: 음식 사진 한 장을 올리면 요리명 1개와 판정이 나온다
    features: [REQ-1, REQ-2, REQ-5, REQ-3, REQ-4]
    steps:
      - 첫 화면에서 "식단 제한 설정"을 누른다
      - 프리셋에서 "채식"을 누른다
      - '"저장"을 누른다'
      - '"사진 올리기"를 누르고 설렁탕 음식 사진(e2e/fixtures/seolleongtang.jpg)을 고른다'
    expected:
      - 판정 화면에 메뉴가 "설렁탕" 1개만 보인다
      - 설렁탕에 "불가" 배지와 근거 한 줄이 보인다

  - id: diet-toggle-only
    title: 프리셋 없이 토글만으로 식단 제한을 정해 판정받는다
    features: [REQ-3, REQ-4]
    steps:
      - 첫 화면에서 "식단 제한 설정"을 누른다
      - 토글 목록에서 "고기"를 켠다
      - '"저장"을 누른다'
      - '"사진 올리기"를 누르고 설렁탕 음식 사진(e2e/fixtures/seolleongtang.jpg)을 고른다'
    expected:
      - 식단 제한 설정 화면에서 "고기" 토글이 켜져 있다
      - 판정 화면에 "설렁탕"과 "불가" 배지, 고기가 들어간다는 근거가 보인다

  - id: manual-input-fallback
    title: 사진에서 메뉴를 하나도 못 읽으면 이름을 직접 입력해 판정받는다
    features: [REQ-2, REQ-3, OPT-1]
    steps:
      - 첫 화면에서 "식단 제한 설정"을 누른다
      - 프리셋에서 "할랄"을 누른다
      - '"저장"을 누른다'
      - '"사진 올리기"를 누르고 메뉴가 없는 사진(e2e/fixtures/no-menu.jpg)을 고른다'
      - 나타난 메뉴 이름 입력칸에 "김치찌개"를 입력한다
      - '"판정하기"를 누른다'
    expected:
      - 사진을 올린 뒤 메뉴 이름 입력칸이 나타난다
      - 판정 화면에 "김치찌개"와 "안전", "확인 필요", "불가" 중 하나의 배지, 근거 한 줄이 사진 판정과 같은 형식으로 보인다

  - id: manual-input-unknown-menu
    title: 음식 DB에 없는 메뉴를 입력하면 만개의 레시피에서 재료를 찾아와 판정한다
    features: [REQ-3, REQ-5, OPT-1]
    steps:
      - 첫 화면에서 "식단 제한 설정"을 누른다
      - 프리셋에서 "할랄"을 누른다
      - '"저장"을 누른다'
      - '"사진 올리기"를 누르고 메뉴가 없는 사진(e2e/fixtures/no-menu.jpg)을 고른다'
      - 나타난 메뉴 이름 입력칸에 음식 DB 시드에 없는 메뉴 "된장찌개"를 입력한다
      - '"판정하기"를 누른다'
    expected:
      - 데이터베이스에 없는 메뉴라는 팝업 없이 판정 화면으로 넘어간다
      - 판정 화면에 "된장찌개"와 "안전", "확인 필요", "불가" 중 하나의 배지, 근거 한 줄이 사진 판정과 같은 형식으로 보인다
