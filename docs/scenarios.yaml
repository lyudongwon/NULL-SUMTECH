# NULL 팀 사용자 핵심 흐름. 2026-10-29 docs/problem.yaml features F1~F11(팀 기능 명세 문서 기준)에 맞춰 다시 씀.
# steps는 화면의 메뉴·버튼 이름으로 한 줄에 한 동작. 버튼 이름은 실제 화면을 만들면 그 이름에 맞춰 고친다.
# 흐름마다 앞 흐름이 만든 데이터에 기대지 않도록 첫 화면에서 식단 제한부터 정한다.
# 웹 서비스로 만든다. 사진은 파일 선택·드래그·모바일 카메라 촬영으로 올리고(F1), E2E에서는 e2e/fixtures 사진을 올린다.
# 예시 메뉴는 판정이 흔들리지 않도록 큐레이션 메뉴 13종(F4) 안에서 고른다.
# F2(이미지 축소)·F3의 캐시·최대 15개 규칙은 화면 동작이 아니라 흐름에 넣지 않는다. F11(음식점 추천)은 명세가 비어 있어 흐름이 없다.

platform: mobile
platformReason: |-
  웹 서비스지만 학식당에서 메뉴를 고르는 그 자리에서 휴대폰 브라우저로 열어,
  휴대폰 카메라로 메뉴판이나 음식을 찍어 바로 먹을지 말지 정하기 때문이다.

login: false # 로그인 없이 식단 제한 프로필을 브라우저에 저장한다고 가정(팀 확인 필요)

scenarios:
  - id: scan-menu-board-vegetarian
    title: 메뉴판 사진을 올리면 메뉴마다 3단계 판정 배지와 근거가 나온다
    features: [F1, F3, F4, F5, F8, F10]
    steps:
      - 첫 화면에서 "식단 제한 설정"을 누른다
      - 프리셋에서 "채식"을 누른다
      - 저장 버튼("저장")을 누른다
      - 사진 올리기 버튼("사진 올리기")을 누르고 메뉴판 사진(e2e/fixtures/menu-board.jpg, 설렁탕·콩나물국·그린샐러드·버섯리조또가 적힘)을 고른다
    expected:
      - 판정 화면에 메뉴판의 메뉴 이름 4개가 각각 보인다
      - 메뉴마다 "안전", "확인 필요", "불가" 중 하나의 배지와 근거 한 줄이 보인다
      - 설렁탕은 "불가" 배지와 근거 "소고기 확인 — 채식 제한(고기)"가 보인다
      - 화면 하단에 "판정 보조이며, 최종 확인은 본인과 영양사에게."가 보인다

  - id: scan-food-photo-single-dish
    title: 음식 사진 한 장을 올리면 요리명 1개와 판정이 나온다
    features: [F1, F3, F5, F8]
    steps:
      - 첫 화면에서 "식단 제한 설정"을 누른다
      - 프리셋에서 "채식"을 누른다
      - 저장 버튼("저장")을 누른다
      - 사진 올리기 버튼("사진 올리기")을 누르고 설렁탕 음식 사진(e2e/fixtures/seolleongtang.jpg)을 고른다
    expected:
      - 판정 화면에 메뉴가 "설렁탕" 1개만 보인다
      - 설렁탕에 "불가" 배지와 근거 "소고기 확인 — 채식 제한(고기)"가 보인다

  - id: switch-profile-rejudge
    title: 프로필 탭을 바꾸면 사진을 다시 읽지 않고 같은 메뉴를 새 기준으로 다시 판정한다
    features: [F5, F6]
    steps:
      - 첫 화면에서 "식단 제한 설정"을 누른다
      - 프리셋에서 "채식"을 누른다
      - 저장 버튼("저장")을 누른다
      - 사진 올리기 버튼("사진 올리기")을 누르고 메뉴판 사진(e2e/fixtures/menu-board.jpg)을 고른다
      - 판정 화면의 프로필 탭에서 "할랄"을 누른다
    expected:
      - 메뉴 목록은 그대로 4개이고 사진 판독 요청(POST /api/scan)은 다시 보내지 않는다
      - 설렁탕의 근거에서 "채식 제한(고기)"가 사라지고 배지와 근거가 할랄 기준으로 바뀐다

  - id: verdict-detail
    title: 메뉴를 누르면 판정 근거 상세(성분 확인·추정, 확신도, 적용 규칙)를 본다
    features: [F4, F5, F7]
    steps:
      - 첫 화면에서 "식단 제한 설정"을 누른다
      - 프리셋에서 "채식"을 누른다
      - 저장 버튼("저장")을 누른다
      - 사진 올리기 버튼("사진 올리기")을 누르고 설렁탕 음식 사진(e2e/fixtures/seolleongtang.jpg)을 고른다
      - 판정 화면에서 "설렁탕"을 누른다
    expected:
      - 상세 화면에 설렁탕의 추정 성분 목록이 보이고 성분마다 "확인" 또는 "추정"이 표시된다
      - 성분마다 확신도(high·medium·low)가 보인다
      - 적용된 판정 규칙 번호가 보인다

  - id: custom-ingredient-forbidden
    title: 직접 입력한 성분이 들어간 메뉴는 "불가"로 판정한다
    features: [F5, F8]
    steps:
      - 첫 화면에서 "식단 제한 설정"을 누른다
      - 직접 입력 칸에 "계란"을 입력한다
      - 추가 버튼("추가")을 누른다
      - 저장 버튼("저장")을 누른다
      - 사진 올리기 버튼("사진 올리기")을 누르고 계란말이 음식 사진(e2e/fixtures/gyeranmari.jpg)을 고른다
    expected:
      - 판정 화면에 "계란말이"와 "불가" 배지가 보인다
      - 근거에 "계란"이 들어 있다

  - id: halal-preset-toggles
    title: 할랄 프리셋을 고르면 해당 그룹이 켜진다
    features: [F8]
    steps:
      - 첫 화면에서 "식단 제한 설정"을 누른다
      - 프리셋에서 "할랄"을 누른다
    expected:
      - 9개 그룹 중 "돼지고기", "술", "젤라틴"이 켜져 있다
      - 나머지 그룹(계란, 우유, 견과, 고기, 생선·해산물, 육수)은 꺼져 있다

  - id: manual-input-fallback
    title: 사진에서 메뉴를 하나도 못 읽으면 이름을 직접 입력해 판정받는다
    features: [F3, F5, F9]
    steps:
      - 첫 화면에서 "식단 제한 설정"을 누른다
      - 프리셋에서 "할랄"을 누른다
      - 저장 버튼("저장")을 누른다
      - 사진 올리기 버튼("사진 올리기")을 누르고 메뉴가 없는 사진(e2e/fixtures/no-menu.jpg)을 고른다
      - 나타난 메뉴 이름 입력칸에 "김치찌개"를 입력한다
      - 판정 버튼("판정하기")을 누른다
    expected:
      - 사진을 올린 뒤 메뉴 이름 입력칸이 나타난다
      - 판정 화면에 "김치찌개"와 "안전", "확인 필요", "불가" 중 하나의 배지, 근거 한 줄이 사진 판정과 같은 형식으로 보인다
