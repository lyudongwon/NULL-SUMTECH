# NULL 팀 문제정의 — Can I Eat? (먹어도 돼?)
# 2026-10-29 종이 캔버스를 옮겨 왔고, 종이에 없던 칸은 null이나 []로 비워 뒀다. 서비스 이름 결정은 docs/decisions.md 참고.

statement: |-
  외국인 유학생은 학식 메뉴에 자기가 못 먹는 재료(돼지고기, 땅콩 등)가 들어 있는지 알 수 없어서, 먹고 싶은 메뉴를 포기하거나 아는 메뉴만 고른다.
  그래서 싸고 가까운 학식을 두고도 먹을 수 있는 음식이 계속 줄어든다.
canvas:
  context: 끼니때마다 교내 학식당에서 메뉴를 고를 때 일어난다.
  customer: |-
    종교·알레르기·채식 등의 이유로 먹지 못하는 재료가 있는 외국인 유학생
    핵심 고객: 할랄을 지키는 이슬람 유학생(P1), 땅콩 알레르기가 있는 유학생(P2)
  root_problem: |-
    학식당은 원재료나 알레르기 성분을 표시할 의무가 없어서(R2) 메뉴판에 요리 이름만 적는다. 고추장, 양념장, 육수처럼 이름에 드러나지 않는 재료는 먹는 사람이 알 방법이 없다.
    유학생은 3년 사이 크게 늘었지만(R1), 할랄 메뉴 같은 대응은 비용 부담 때문에 일부 학교에서만 하고 있다(R4).
  impact:
    feeling: 먹고 싶은 메뉴를 앞에 두고 포기하는 실망감(E1)과 짜증(E2), 나만 못 먹는다는 배제감
    # 숫자는 2026-10-29 채팅에서 학생이 준 값. 확인 시간·포기 횟수는 E1·E2 유학생 기준 어림값.
    measurable: |-
      먹어도 되는지 확인하는 시간: 지금은 번역기로 메뉴 하나에 약 5분 → 목표는 15초 안에 판정과 확인할 재료까지
      식단 제한 때문에 포기한 학식 끼니: 한 달에 약 10끼
  alternatives:
    - how_used: 아는 음식이나 가던 곳만 간다.
      shortcoming: 먹는 음식의 다양성 감소
      why_ours: |-
        처음 보는 메뉴도 사진 한 장이면 15초 안에 먹어도 되는 메뉴와 확인이 필요한 재료가 나와서, 아는 메뉴만 고르지 않아도 된다.
    - how_used: 직접 해먹는다.
      shortcoming: 번거로움, 식재료를 구하기 힘들다.
      why_ours: |-
        도시락을 싸거나 장을 보지 않아도, 학식당에서 바로 내 기준에 맞는 메뉴를 골라 싸고 편하게 먹을 수 있다.
    - how_used: 사전에 파파고·ChatGPT 등으로 미리 조사해 확인하고 간다.
      shortcoming: |-
        부정확함, 번거로움
        파파고는 이름만 번역할 뿐 나에게 안전한지는 알려 주지 않고, ChatGPT는 같은 질문에도 답이 달라지거나 근거 없이 확신하며 매번 식이 조건을 다시 설명해야 한다.
      why_ours: |-
        번역기는 "비빔밥"을 "bibimbap"으로 바꿀 뿐 고추장 속 재료는 알려 주지 않는다.
        우리는 한 번 저장한 식단 제한으로 매번 같은 기준으로 판정하고, 어떤 재료 때문인지 근거까지 보여 준다.
personas:
  - id: P1
    description: 종교적 이유로 돼지고기를 먹지 못하는 이슬람 유학생
    source: 학생 제공 (2026-10-29 채팅), E1 근거
  - id: P2
    description: 땅콩 알레르기가 있는 외국인 유학생
    source: 학생 제공 (2026-10-29 채팅)
experiences:
  - id: E1
    when: 6월, 학식당에서 메뉴를 고르던 때
    what_happened: |-
      학식당에서 비빔밥을 시키려 했는데, 비빔밥에 들어가는 고추장에 돼지고기가 들어 있는지 알 수 없었다.
    workaround: 위험을 감수하고 먹을 수 없어 비빔밥 먹기를 포기했다.
    feeling: 실망감
    quote: "먹고 싶었는데 못 먹어서 아쉬웠다."
    source: 학생 제공 (2026-10-29 채팅), 이슬람 유학생의 경험 (P1). quote는 본인이 한 말을 학생이 전한 것
  - id: E2
    when: 7월 더운 날, 학식당에서 메뉴를 고르던 때
    what_happened: |-
      더운 날 학식 메뉴에서 비빔국수를 주문하려 했는데, 비빔국수 양념장에 땅콩이 들어 있는지 알 수 없었다.
    workaround: 땅콩 함유 여부를 몰라 식사를 포기했다.
    feeling: 짜증남
    quote: "더운 날이라 먹고 싶었는데 못 먹어서 짜증났다."
    source: 학생 제공 (2026-10-29 채팅), 땅콩 알레르기가 있는 키르기스스탄 유학생의 경험 (P2). quote는 본인이 한 말을 학생이 전한 것
sources:
  - id: R1
    url: https://www.immigration.go.kr/moj/2412/subview.do
    title: 법무부 출입국·외국인정책본부 체류외국인 현황 (유학생 현황)
    claim: 국내 체류 외국인 유학생은 2022년 197,234명, 2025년 308,838명(2025년 말 기준)이다.
  - id: R2
    url: https://www.law.go.kr/법령/식품위생법시행규칙
    title: 식품위생법 시행규칙 제95조·[별표 24] 집단급식소의 설치ㆍ운영자 준수사항 (총리령 제2150호, 2026. 9. 1. 시행)
    claim: |-
      대학 식당 같은 집단급식소 설치·운영자의 준수사항은 제95조제3항에 따라 별표 24로 정한다.
      별표 24는 주방용구 소독, 배식하고 남은 음식물 재사용 금지, 검수·조리 위생관리 점검 기록(3개월 보관), 지하수 수질검사, 동물 내장 조리 기구 세척·살균, 모범업소 표시 제한, 당일 구입 빵류·과자류·떡류 거래명세서 보관(6개월)의 7개 항목만 두고, 알레르기·원재료 표시 조항은 없다.
  # R3·R4는 2026-10-29 웹 검색 결과에 인용된 원문 문장(R3는 논문 초록)으로 확인. 네트워크 제한으로 원문 페이지는 직접 열지 못했다.
  - id: R3
    url: https://doi.org/10.7318/KJFC/2020.35.3.265
    title: 홍경희·이현숙, 부산지역 외국인 유학생의 종교에 따른 한국 식생활 적응도 및 대학급식소 이용행태 조사 (한국식생활문화학회지 35(3), 2020)
    claim: |-
      2017년 4~6월 부산의 한 대학 외국인 유학생 609명을 조사한 결과, 무슬림 학생은 국내에서 할랄 식품을 구하기 어려웠고 학교식당 메뉴로 할랄 식품을 원하는 요구가 컸다.
      대학 급식에서 한국 음식을 경험한 비율은 무슬림 학생이 45.3%로 가장 낮았다(기독교 79.7%).
  - id: R4
    url: https://www.segye.com/newsView/20180402005009
    title: "[이슈+] \"글쎄\"·\"당연\" 첫 할랄푸드 학생식당 바라보는 서울대생들 (세계일보, 2018-04-02)"
    claim: 서울대는 무슬림 학생들이 음식 불편을 호소하자 2018년 학내 식당 한 곳에 할랄 메뉴를 도입했고, 학교 관계자는 식재료와 관리비를 따지면 적자로 운영되는 메뉴라고 말했다.
five_whys:
  symptom: 외국인 유학생이 학식 메뉴에 자기가 못 먹는 재료가 들어 있는지 알 수 없어 식사를 포기한다. (E1, E2)
  whys:
    - 메뉴판에는 요리 이름만 있고, 고추장·양념장·육수 속 재료는 적혀 있지 않다. (E1, E2)
    - 학식당 같은 집단급식소는 원재료·알레르기를 표시할 의무가 없다. (R2)
    - 집단급식소 준수사항(별표 24)은 위생 관리 7개 항목만 두고, 이용자의 식단 제한은 다루지 않는다. (R2)
    - 그래서 식단 제한 대응은 학교 자율에 맡겨지는데, 할랄 메뉴는 재료·관리비 때문에 적자로 운영돼 일부 학교만 감당한다. (R4)
    - 그사이 외국인 유학생은 3년 만에 197,234명에서 308,838명으로 늘었고(R1), 무슬림 유학생은 할랄 식품을 구하기 어렵고 학식을 가장 적게 경험한다(R3). 수요는 커졌지만 대부분의 학식당에는 유학생이 스스로 확인할 수단이 없다.
solution_paths:
  - path: 메뉴판·음식 사진에서 메뉴를 읽고 숨은 재료를 추정해, 내 식단 제한 기준으로 3단계 판정한다
    status: chosen
    reason: |-
      메뉴판에는 요리 이름만 있고 학식당은 원재료를 알려 줄 의무가 없어(R2, E1·E2), 먹는 사람이 직접 판단할 수단이 필요하다.
      사진 한 장이면 한국어를 몰라도 메뉴를 넣을 수 있고, 숨은 재료 추론(REQ-5)으로 이름에 안 보이는 양념까지 본다.
      판정은 AI가 아니라 정해진 규칙(R0~R4)이 해서 같은 메뉴는 늘 같은 결과와 근거가 나온다. AI는 사진 판독과 재료 추정에만 쓴다.
      검토했지만 고르지 않은 방법:
      - 학식당에 원재료·알레르기 표시를 요청: 표시 의무가 없어(R2) 강제할 수 없고, 학교마다 운영을 바꿔야 해서 학생이 만들 수 있는 해법이 아니다.
      - 메뉴판을 외국어로 번역하는 앱: 이름만 바뀌고 고추장·양념장 속 재료는 그대로 안 보인다(대안 3, E1·E2).
      - 학식당에 할랄·채식 전용 코너를 만들기: 할랄 메뉴는 재료·관리비 때문에 적자로 운영돼(R4) 일부 학교만 감당할 수 있고, 알레르기(P2)는 해결하지 못한다.
insight:
  claim: 외국인 유학생은 메뉴 이름이 아니라, 고추장·양념장처럼 이름에 드러나지 않는 재료 때문에 식사를 포기한다.
  evidence: |-
    E1: 비빔밥 자체는 먹을 수 있었지만, 고추장에 돼지고기가 들어 있는지 몰라 포기했다.
    E2: 비빔국수 자체는 먹을 수 있었지만, 양념장에 땅콩이 들어 있는지 몰라 포기했다.
    두 경우 모두 메뉴 이름만으로는 판단할 수 없었고, 학식당은 원재료 표시 의무가 없다(R2).
  design_decision: |-
    메뉴 이름만 번역해서는 E1·E2를 풀 수 없다. 양념·육수 속 숨은 재료까지 추정해서(REQ-5) 내 식단 제한 기준으로 안전 / 확인 필요 / 불가를 나누고(REQ-3), 왜 그런지 재료 단위로 보여 준다(REQ-6).
    학식당 레시피를 모르는 메뉴는 우리도 '불가'라고 단정하지 못하고 '확인 필요'까지만 말할 수 있다. 대신 어떤 재료가 문제인지 메뉴판과 같은 한국어로 짚어 주기 때문에, 유학생은 "고추장에 돼지고기 들어가요?"처럼 그 재료 하나만 직원에게 물어보거나 같은 메뉴판의 안전한 메뉴를 고르면 된다.
    안전한 메뉴가 하나도 없으면 다른 음식점을 추천한다(OPT-2).
# 기능의 원본. 2026-10-29 팀이 합의한 기능 명세서(REQ-1~7 주요, OPT-1~3 부가)를 옮겼고, 같은 날 REQ-8(영어 화면)을 더했다.
# 프로필 전환은 뺐다. 로그인 없이 서버가 Auto Increment로 발급한 user_id로 사용자를 구분한다.
# API는 docs/api.md, 판정 규칙(R0~R4)은 docs/api.md > REQ-3에 있다.
features:
  - id: REQ-1 # 주요
    name: 사진 업로드
    input: 파일 선택, 드래그 앤 드롭, 모바일 카메라 촬영으로 고른 사진
    output: 올린 사진이 메뉴 판독(REQ-2)으로 넘어간다
    done: JPEG·PNG·WEBP 사진(10MB 이하)을 파일 선택·드래그 앤 드롭·모바일 카메라 촬영 중 어느 방법으로 올려도 메뉴 판독이 시작된다. 사진을 고르지 않았거나, 지원하지 않는 형식이거나, 10MB를 넘으면 업로드되지 않고 이유를 알리는 영어 문구가 보인다(문구는 docs/api.md > REQ-1 > 예외 상황).
  - id: REQ-2 # 주요
    name: 메뉴 판독
    input: 메뉴판 사진 또는 음식 사진
    output: 메뉴판 사진이면 메뉴 이름 전부, 음식 사진이면 요리명 1개
    done: 메뉴판 사진을 올리면 적힌 메뉴 이름이 모두, 음식 사진을 올리면 요리명 1개가 나온다. 읽지 못한 항목은 추측하지 않고 비워 둔다. 메뉴를 하나도 읽지 못하거나, 메뉴판·음식 사진이 아니거나, 판독이 실패하거나 45초 안에 끝나지 않으면 메뉴 이름 입력칸(OPT-1)이 나타난다.
  - id: REQ-3 # 주요
    name: 위험 정도 3단계 판정과 근거
    input: 음식 이름, 식단 제한 프로필
    output: 메뉴마다 안전(Safe)·확인 필요(Check first)·불가(Avoid) 중 하나의 배지와 판정 근거
    done: 음식 이름이 있으면 메뉴마다 안전·확인 필요·불가 중 하나의 배지와 근거 한 줄이 보인다. 판정 규칙은 docs/api.md > REQ-3 > 판정 규칙을 따른다. 식단 제한을 저장하지 않은 사용자는 모든 메뉴가 안전(R0)으로 나온다. 음식 이름이 비어 있으면(null 또는 빈 문자열) 판정하지 않고 "Please enter a menu name." 팝업이 뜬다.
  - id: REQ-4 # 주요
    name: 식단 제한 설정
    input: 프리셋(할랄, 채식, 비건)과 토글(고기, 돼지고기, 소고기, 해산물, 계란, 우유·유제품, 땅콩, 술) 선택
    output: 제한 음식이 설정된 식단 제한 프로필
    done: 프리셋이나 토글을 누르고 저장하면 제한 음식 설정이 바뀌고, 이후 판정(REQ-3)에 그 프로필이 쓰인다. 설정 화면을 다시 열면 저장한 프리셋·토글이 그대로 켜져 있고, 저장한 적이 없으면 모든 토글이 꺼져 있다(제한 없음). 같은 사용자의 저장 요청이 동시에 들어오면 먼저 온 요청만 반영하고, 나중 요청은 저장되지 않으며 "Another request was saved first. Please try again."이 보인다. 채식은 고기·해산물을 빼고 계란·유제품은 허용하며, 비건은 계란·유제품까지 뺀다. 알레르기는 프리셋 없이 토글로 고른다.
  - id: REQ-5 # 주요
    name: 숨은 성분 추론
    input: 음식 이름
    output: 재료 목록과 재료마다 확인/추정 구분·출처. 음식 DB → 이름 속 재료 단어·조리법 추정 → 만개의 레시피 검색(DB에 없을 때) → AI 추정(거기에도 없을 때) 순으로 찾는다
    done: 음식 이름을 넣으면 이름에 들어 있는 재료 단어와 조리법으로 추정한 재료가 판정 근거에 쓰인다. 음식 DB에 없는 메뉴는 만개의 레시피에서 검색해 찾아온 재료로 추정하고, 만개의 레시피에도 없거나 검색이 실패하면 AI가 재료를 추정한다. AI 추정만으로는 '불가'가 나오지 않고, 재료가 모두 AI 추정이면 식단 제한이 있는 사용자에게 '확인 필요'가 나온다. 어디에서도 재료를 찾지 못하면 재료 목록이 비고, 식단 제한이 있는 사용자에게는 '확인 필요'가 나온다. 어느 경우에도 '등록되지 않은 메뉴' 팝업은 띄우지 않는다. 찾아온 재료는 음식 DB에 저장해 같은 메뉴를 다시 검색하지 않는다.
  - id: REQ-6 # 주요
    name: 근거 상세
    input: 판정 결과(REQ-3)
    output: 성분별 확인/추정 구분, 확신도, 적용 규칙
    done: 판정 화면에서 메뉴를 누르면 성분마다 확인/추정 구분, 확신도(높음·보통·낮음), 적용된 규칙이 보인다. 누른 뒤 따로 불러오는 시간 없이 바로 보인다(근거 상세는 판정 응답에 함께 들어 있다).
  - id: REQ-7 # 주요
    name: 고지 문구
    input: null
    output: 화면 하단의 고지 문구
    done: 모든 화면 하단에 "For guidance only. Please make the final check yourself or with a dietitian."(판정 보조이며, 최종 확인은 본인과 영양사에게)가 항상 보인다.
  - id: OPT-1 # 부가
    name: 수동 입력
    input: 메뉴명
    output: 사진 판정과 같은 엔진으로 낸 판정 결과
    done: 판독에 실패하면 메뉴 이름을 직접 입력할 수 있고, "Can I eat it?"을 누르면 사진 판정과 같은 배지와 근거가 나온다. 입력칸을 비운 채 누르면 판정하지 않고 "Please enter a menu name." 팝업이 뜬다. 음식 DB에 없는 메뉴도 REQ-5 순서로 재료를 찾아 판정한다.
  - id: OPT-2 # 부가
    name: 음식점 추천
    input: user_id
    output: 학식 대신 갈 수 있는 다른 음식점 추천
    done: 첫 화면에는 "Other restaurants"가 항상 있고, 판정 결과에 '안전' 메뉴가 하나도 없으면 판정 화면에도 "Other restaurants"가 나타난다. 누르면 내 식단 제한 항목을 모두 피하는 음식점이 보인다. 음식점 데이터는 팀이 직접 조사한 학교 주변 음식점을 시드로 넣는다. 조건에 맞는 곳이 없으면 "No restaurants match your diet yet."가 보인다.
  - id: OPT-3 # 부가
    name: 이미지 축소
    input: 원본 이미지
    output: 전송 전 브라우저에서 긴 변 1400px, JPEG 품질 0.85로 줄인 이미지
    done: 긴 변이 1400px 이상인 사진은 긴 변 1400px, JPEG 품질 0.85로 줄여 전송하고, 1400px 미만인 사진은 줄이지 않는다.
  - id: REQ-8 # 주요
    name: 영어 화면
    input: null
    output: 영어로 된 모든 화면 문구(버튼·배지·근거·팝업·고지 문구). 메뉴·재료 이름은 메뉴판의 한국어 원문 그대로
    done: 모든 화면의 버튼·배지·판정 근거·팝업·고지 문구가 영어로 보인다. 메뉴와 재료 이름은 메뉴판에 적힌 한국어 원문 그대로 보여, 학식당의 한국어 메뉴판과 대조하고 직원에게 그대로 보여 줄 수 있다. 문구는 docs/api.md > 화면 문구를 따른다. 한국어 화면은 제공하지 않는다.
