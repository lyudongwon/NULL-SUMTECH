# NULL 팀 문제정의. 2026-10-29 종이 문제정의 캔버스·체크리스트 원문을 옮김.
# 종이에 없는 내용은 null 또는 []로 남김.

statement: |-
  외국인유학생은 학식당에서 원재료를 정확히 알 수 없는 문제때문에 자신의 신념이나 건강에 맞는지 불확실함을 겪는다.
  지금은 익숙한 음식만 먹는 방법으로 버티지만 먹을 수 있는 음식의 종류가 제한된다.
canvas:
  context: 식사시간에 대학교 교내에서 매 식사메뉴를 선택할 때 일어난다.
  customer: |-
    한국 음식에 익숙치 않은 외국인 유학생
    건강적/종교적/신념적 이유로 식단이 제한되는 외국인 유학생
    특정 음식을 못 먹는 사람
  root_problem: |-
    학식당 원재료 표기가 한국어/한국음식에 익숙하지 않은 사람에게는 찾기힘들거나 익숙치 않다.
    외국인 유학생의 급격한 증가로 기반이 아직 마련되지 못했다.
  impact:
    feeling: 두려움, 배제 되는 느낌
    measurable: 저렴한 가격으로 학식을 먹을 기회
  alternatives:
    - how_used: 아는 음식이나 가던 곳만 간다.
      shortcoming: 먹는 음식의 다양성 감소
      why_ours: |-
        국내 거주 외국인 유학생 맞춤형 식이 안전 솔루션의 부재 (시장 적합성)
        현재 국내 시장에는 급증하는 외국인 유학생의 다양한 식이 제약(할랄, 힌두, 채식, 알레르기 등)을 통합적으로 관리하고 판별해 주는 전용 라이프스타일 솔루션이 부재합니다. 본 서비스는 타깃 유저의 고충(Pain Point)에 직결된 국내 최초의 '한국형 식이 커스텀 큐레이션 앱'으로서, 시장 진입 초기 독점적 선점 효과와 명확한 타깃 확장성을 확보합니다.
    - how_used: 직접 해먹는다.
      shortcoming: 번거로움, 식재료를 구하기 힘들다.
      why_ours: |-
        3단계 위험도 분류 평가 모델을 통한 오섭취 사고 예방 (서비스 차별성)
        기존의 해외 앱이나 단순 데이터베이스는 '가능/불가능'의 이분법적 판별에 그쳐, 한국 음식 특유의 숨은 식재료나 교차 오염 가능성을 제대로 다루지 못합니다. 본 솔루션은 위험도를 [안전(가능) / 확인 필요(주의) / 섭취 불가]의 3단계 구조로 세분화하여 정밀 분석합니다. 이를 통해 사골 육수, 젓갈류, 양념 베이스 등 모호한 성분에 대해 선제적인 주의 정보를 제공하여 외국인 유학생의 불상사를 미연에 방지합니다.
    - how_used: 사전에 미리 충분한 조사를 통해 확인하고 간다.
      shortcoming: 부정확함, 번거로움
      why_ours: |-
        한국 식문화 및 조리법 DB 기반의 독보적 로컬라이제이션 (데이터 경쟁력)
        글로벌 성분 분석 앱은 한국 고유의 복합 조리법(예: 육수 추출 방식, 조미료 성분, 가공식품 표기 체계)을 완벽히 인식하지 못해 심각한 오판 리스크가 존재합니다. 본 솔루션은 한국인의 실제 조리법 데이터와 식재료 성분 DB를 자체 표준화하여 교차 검증 알고리즘을 구축하였습니다. 이를 통해 국내 외식·가공식품 환경에서 타사 대비 압도적인 정확도와 실용성을 보장합니다.
personas:
  - id: P1
    description: 외국인 유학생이 포함돼 있는 연구실
    source: 종이 기록
experiences:
  - id: E1
    when: 연구실 단체 회식 장소를 정하고 식사를 준비하던 날
    what_happened: |-
      보통 많이 도시락을 싸서 다니고 회식을 한참을 알아본 뒤에 회식장소를 정할수있다.
      돼지고기 포함되지 않은 걸 먹어야 하는게 짜증난다.
    workaround: 도시락을 싸서 다니고, 회식장소는 한참을 알아본 뒤에 정한다.
    feeling: 짜증난다
    quote: "한국 식당은 메뉴판만 봐선 돼지고기나 돈골 육수 사용 여부를 알 수 없어요. 회식할 때마다 내가 먹을 수 있는 안전한 음식을 일일이 검증하고 찾으러 다니는 게 너무 힘들고 스트레스였습니다."
    source: 종이 기록 + 학생 보강 (대학원 연구실 소속 무슬림 외국인 유학생의 경험)
sources:
  - id: R1
    url: https://www.immigration.go.kr/moj/2412/subview.do
    title: 법무부 출입국·외국인정책본부 체류외국인 현황 (유학생 현황)
    claim: 국내 체류 외국인 유학생은 2022년 197,234명, 2025년 308,838명(2025년 말 기준)이다.
five_whys:
  symptom: 학식의 원재료를 파악하기 어렵다.
  whys:
    - 성분 표시가 의무가 아니다.
    - 법이 제정되어 있지 않다.
    - 알레르기/신념에 따른 거부를 많이 겪지 않았다.
    - 외국인 유학생이 3년 동안 급격히 증가했기 때문이다.
    - 한류의 영향이 크다.
solution_paths:
  - path: AI를 이용한 원재료 분석 솔루션 / 위험도 평가 솔루션
    status: chosen
    reason: 빠르고 간편하게 확인할 수 있다.
insight:
  claim: 식사를 못하는 외국인 유학생
  evidence: 종교 이유로 먹지 못했던 사례가 있었다.
  design_decision: 사진 한장으로 먹을 수 있는지 위험도를 [안전(가능) / 확인 필요(주의) / 섭취 불가] 3단계로 보여주는 AI 솔루션
