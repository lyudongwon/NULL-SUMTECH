# NULL 팀 문제정의 — Can I Eat? (먹어도 돼?)
# 2026-10-29 종이 캔버스를 옮겨 왔고, 종이에 없던 칸은 null이나 []로 비워 뒀다. 서비스 이름 결정은 docs/decisions.md 참고.

statement: |-
  외국인 유학생은 학식 메뉴에 자기가 못 먹는 재료(돼지고기, 땅콩 등)가 들어 있는지 알 수 없어서, 먹고 싶은 메뉴를 포기하거나 아는 메뉴만 고른다.
  그래서 싸고 가까운 학식을 두고도 먹을 수 있는 음식이 계속 줄어든다.
canvas:
  context: 끼니때마다 교내 학식당에서 메뉴를 고를 때 일어난다.
  customer: |-
    종교·알레르기·채식 등의 이유로 먹지 못하는 재료가 있는 외국인 유학생
    핵심 고객: 할랄을 지키는 이슬람 유학생(P1), 땅콩 알레르기가 있는 유학생(P2)
  root_problem: |-
    초·중·고 급식과 달리 대학 학식당은 원재료나 알레르기 성분을 표시할 의무가 없어서(R2, R5) 메뉴판에 요리 이름만 적는다. 고추장, 양념장, 육수처럼 이름에 드러나지 않는 재료는 먹는 사람이 알 방법이 없다.
    유학생은 3년 사이 크게 늘었지만(R1), 할랄 메뉴 같은 대응은 학교 자율이고 비용 부담이 크다. 서울대도 2018년에야 식당 한 곳에 할랄 메뉴를 들였고, 식재료·관리비 때문에 적자로 운영한다(R4).
  impact:
    feeling: 먹고 싶은 메뉴를 앞에 두고 포기하는 실망감(E1)과 짜증(E2), 나만 못 먹는다는 배제감
    # 지금 값의 출처: 2026-10-23 측정 기록(측정자 김정우).
    # [확인 시간] 일반 번역기와 인터넷 검색만으로 비빔밥의 돼지고기(E1), 비빔국수의 땅콩(E2) 포함 여부를 확인하며 걸린 시간을 음식마다 3회 쟀다.
    #   비빔밥: 4분 20초 / 3분 45초 / 5분 10초 → 평균 4분 25초
    #   비빔국수: 5분 15초 / 4분 40초 / 6분 05초 → 평균 5분 20초
    #   두 음식 평균 약 4분 53초. 이름을 번역해도 소스·양념 속 재료는 알 수 없어 여러 정보를 더 찾아야 했다.
    # [포기 끼니] E1(할랄)·E2(땅콩 알레르기)에게 지난 한 달 재료를 몰라 학식을 포기한 횟수를 물었다. 두 사람 모두 하루 평균 1회 학식을 이용한다.
    #   E1: 9회(돼지고기·육류 성분 확인 불가, 대신 편의점 음식·간편식)
    #   E2: 11회(땅콩·소스 성분 확인 불가, 대신 재료가 확실한 음식 위주)
    #   한 사람당 월평균 10회(합계 20회).
    # 한계: 확인 시간은 한 사람이 음식 두 개를 3회씩 잰 값이고, 포기 횟수는 두 사람이 지난 한 달을 떠올려 답한 값이다.
    # 포기 끼니 목표(5끼 이하)와 판정 정확도 지표는 2026-10-30 팀이 정한 목표다.
    measurable: |-
      먹어도 되는지 확인하는 시간: 지금은 번역기·검색으로 메뉴 하나에 평균 4분 53초(비빔밥 4분 25초, 비빔국수 5분 20초, 각 3회. 2026-10-23 측정) → 목표는 15초 안에 판정과 확인할 재료까지
      측정: "Upload photo"로 사진을 고른 때부터 판정 화면에 배지가 보일 때까지. E1·E2 시나리오 사진(비빔밥·비빔국수)으로 10회 재서 10회 모두 15초 이내면 달성
      식단 제한 때문에 포기한 학식 끼니: 지금 한 달에 한 사람당 평균 10끼(E1 9끼, E2 11끼. 2026-10-23 조사) → 목표 한 달 5끼 이하. '확인 필요' 메뉴는 문제 재료 하나만 직원에게 물어 먹을 수 있지만, 레시피를 모르는 메뉴는 남으므로 0이 아니라 절반을 목표로 한다
      측정: 해커톤 뒤 E1·E2 유학생이 서비스를 쓰기 전과 쓴 뒤 각 한 달 동안 학식에서 포기한 끼니를 기록해 비교한다
      판정 정확도: 배지를 정해 둔 시나리오 5개(scenarios.yaml의 설렁탕 "Avoid" 3개, 비빔밥·비빔국수 "Check first" 2개)에서 실제 배지가 5/5 일치하고, 제한 재료가 확인(Confirmed)된 메뉴에 "Safe"가 나온 경우 0건
      측정: 시나리오 E2E(e2e/scenarios)를 돌려 배지를 비교한다. 해커톤 기간에 잴 수 있다
  alternatives:
    - how_used: 아는 음식이나 가던 곳만 간다.
      shortcoming: |-
        먹는 음식의 다양성 감소
        처음 보는 한국 음식은 피하게 된다. 부산 한 대학 조사에서 대학 급식으로 한국 음식을 경험한 비율은 무슬림 학생이 45.3%로 가장 낮았다(R3).
      why_ours: |-
        처음 보는 메뉴도 사진 한 장이면 먹어도 되는 메뉴와 확인이 필요한 재료가 나와서(목표 15초 이내, measurable), 아는 메뉴만 고르지 않아도 된다.
    - how_used: 직접 해먹는다.
      shortcoming: |-
        번거로움, 식재료를 구하기 힘들다.
        무슬림 유학생은 국내에서 할랄 식품을 구하기 어려웠다(R3).
      why_ours: |-
        도시락을 싸거나 따로 식재료를 구하지 않아도, 학식당 메뉴판을 찍어 그 자리에서 내 기준에 맞는 메뉴를 고를 수 있다.
    - how_used: 사전에 파파고·ChatGPT 등으로 미리 조사해 확인하고 간다.
      shortcoming: |-
        부정확함, 번거로움
        파파고는 이름만 번역할 뿐 나에게 안전한지는 알려 주지 않고, ChatGPT는 같은 질문에도 답이 달라지거나 근거 없이 확신하며 매번 식이 조건을 다시 설명해야 한다.
      why_ours: |-
        번역기는 "비빔밥"을 "bibimbap"으로 바꿀 뿐 고추장 속 재료는 알려 주지 않는다.
        우리는 한 번 저장한 식단 제한으로 매번 같은 기준으로 판정하고, 어떤 재료 때문인지 근거까지 보여 준다.
personas:
  - id: P1
    description: 종교적 이유로 돼지고기를 먹지 못하는 이슬람 유학생
    source: E1 당사자. 2026-10-23 팀원 김정우가 직접 만남
  - id: P2
    description: 땅콩 알레르기가 있는 외국인 유학생
    source: E2 당사자. 2026-10-23 팀원 김정우가 직접 만남
experiences:
  - id: E1
    when: 2026년 6월, 학식당에서 메뉴를 고르던 때
    what_happened: |-
      학식당에서 비빔밥을 시키려 했는데, 비빔밥에 들어가는 고추장에 돼지고기가 들어 있는지 알 수 없었다.
    workaround: 위험을 감수하고 먹을 수 없어 비빔밥 먹기를 포기했다.
    feeling: 실망감
    quote: "먹고 싶었는데 못 먹어서 아쉬웠다."
    source: 2026-10-23 팀원 김정우가 이슬람 유학생(P1) 본인을 직접 만나 들은 경험. quote는 본인에게 들은 말이다. 같은 자리에서 지난 한 달 포기 횟수도 물었다(canvas > impact 주석)
  - id: E2
    when: 2026년 7월 더운 날, 학식당에서 메뉴를 고르던 때
    what_happened: |-
      더운 날 학식 메뉴에서 비빔국수를 주문하려 했는데, 비빔국수 양념장에 땅콩이 들어 있는지 알 수 없었다.
    workaround: 땅콩 함유 여부를 몰라 식사를 포기했다.
    feeling: 짜증남
    quote: "더운 날이라 먹고 싶었는데 못 먹어서 짜증났다."
    source: 2026-10-23 팀원 김정우가 땅콩 알레르기가 있는 키르기스스탄 유학생(P2) 본인을 직접 만나 들은 경험. quote는 본인에게 들은 말이다. 같은 자리에서 지난 한 달 포기 횟수도 물었다(canvas > impact 주석)
  # E3는 팀원 본인의 경험이다. 계란은 REQ-4의 Egg 토글로 판정되지만, 토마토는 지금 토글 목록에 없다.
  - id: E3
    when: 시점을 특정하기 어렵다. 어느 때부터 체질상 토마토·계란이 몸에 잘 받지 않게 된 뒤, 토스트·햄버거를 사 먹을 때마다
    what_happened: |-
      토스트나 햄버거에는 토마토나 계란이 없을 줄 알았는데, 받아 보면 들어 있는 경우가 있었다. 메뉴 이름만으로는 들어 있는지 알 수 없었다.
    workaround: 안 먹고 버리거나, 주문할 때 빼 달라고 했다.
    feeling: 아쉬움
    quote: "아쉽다."
    source: 팀원 A 본인 경험(체질상 토마토·계란이 맞지 않음). 2026-10-30 본인이 제공
sources:
  - id: R1
    url: https://www.immigration.go.kr/moj/2412/subview.do
    title: 법무부 출입국·외국인정책본부 체류외국인 현황 (유학생 현황)
    claim: 국내 체류 외국인 유학생은 2022년 197,234명, 2025년 308,838명(2025년 말 기준)이다.
  - id: R2
    url: https://www.law.go.kr/LSW/flDownload.do?flSeq=168925163&bylClsCd=110201
    title: 식품위생법 시행규칙 제95조·[별표 24] 집단급식소의 설치ㆍ운영자 준수사항 (총리령 제2150호, 2026. 9. 1. 시행. 별표 24는 2023. 5. 19. 개정)
    claim: |-
      대학 식당 같은 집단급식소 설치·운영자의 준수사항은 제95조제3항에 따라 별표 24로 정한다.
      별표 24는 주방용구 소독, 배식하고 남은 음식물 재사용 금지, 검수·조리 위생관리 점검 기록(3개월 보관), 지하수 수질검사, 동물 내장 조리 기구 세척·살균, 모범업소 표시 제한, 당일 구입 빵류·과자류·떡류 거래명세서 보관(6개월)의 7개 항목만 두고, 알레르기·원재료 표시 조항은 없다.
  # 2026-10-30 R1~R5 원문을 열어 claim과 대조했다. law.go.kr 법령 전체 페이지는 본문을 자바스크립트로 불러오므로, 조문·별표를 바로 보여 주는 주소를 적는다.
  # R2 url은 별표 24 원문 PDF다. 제95조제3항: https://www.law.go.kr/LSW/lsSideInfoP.do?lsiSeq=289161&joNo=0095&joBrNo=00&docCls=jo&urlMode=lsScJoRltInfoR
  # R5 url은 학교급식법 제16조다. 제4조(급식 대상): https://www.law.go.kr/LSW/lsSideInfoP.do?lsiSeq=283421&joNo=0004&joBrNo=00&docCls=jo&urlMode=lsScJoRltInfoR
  # R3 url(DOI)은 KoreaScience 논문 초록으로 연결된다.
  - id: R3
    url: https://doi.org/10.7318/KJFC/2020.35.3.265
    title: 홍경희·이현숙, 부산지역 외국인 유학생의 종교에 따른 한국 식생활 적응도 및 대학급식소 이용행태 조사 (한국식생활문화학회지 35(3), 265-277, 2020)
    claim: |-
      2017년 4~6월 부산의 한 대학 외국인 유학생 609명을 조사한 결과, 무슬림 학생은 국내에서 할랄 식품을 구하기 어려웠고 학교식당 메뉴로 할랄 식품을 원하는 요구가 컸다.
      대학 급식에서 한국 음식을 경험한 비율은 무슬림 학생이 45.3%로 가장 낮았다(기독교 79.7%).
  - id: R4
    url: https://www.segye.com/newsView/20180402005009
    title: "[이슈+] \"글쎄\"·\"당연\" 첫 할랄푸드 학생식당 바라보는 서울대생들 (세계일보, 2018-04-02)"
    claim: |-
      서울대는 자체 설문에서 무슬림 학생 98명 중 73명(74.5%)이 음식을 애로사항으로 꼽자 2018년 학내 식당 한 곳(감골식당)에 할랄 메뉴를 도입했다.
      서울대 관계자는 "식재료와 관리비를 따져보면 복지차원에서 적자로 운영되는 메뉴"라고 말했다.
  - id: R5
    url: https://www.law.go.kr/LSW/lsSideInfoP.do?lsiSeq=283421&joNo=0016&joBrNo=00&docCls=jo&urlMode=lsScJoRltInfoR
    title: 학교급식법 제4조(학교급식 대상)·제16조(품질 및 안전을 위한 준수사항) (법률 제21354호, 2026. 8. 20. 시행)
    claim: |-
      제16조제3항은 학교급식에 알레르기를 유발할 수 있는 식재료를 쓰면 급식 전에 학생에게 알리고 급식 시에 표시하도록 한다.
      이 법의 급식 대상(제4조)은 유치원, 초·중등교육법에 따른 학교, 근로청소년 특별학급·산업체부설 중·고등학교, 대안학교, 교육감이 인정하는 학교이고, 대학은 들어 있지 않다.
five_whys:
  symptom: |-
    외국인 유학생이 학식 메뉴에 자기가 못 먹는 재료가 들어 있는지 알 수 없어 식사를 포기한다. (E1, E2)
    국내 외국인 유학생은 3년 만에 197,234명에서 308,838명으로 늘었고(R1), 무슬림 유학생은 대학 급식에서 한국 음식을 가장 적게 경험한다(R3).
  whys:
    - 왜 알 수 없나? 메뉴판에는 요리 이름만 있고, 고추장·양념장·육수 속 재료는 적혀 있지 않다. (E1, E2)
    - 왜 재료를 적지 않나? 대학 학식당은 원재료·알레르기를 표시할 의무가 없다. (R2, R5)
    - 왜 의무가 없나? 알레르기 표시 의무는 초·중·고 급식(학교급식법)에만 있고(R5), 대학 학식당 같은 집단급식소의 준수사항(별표 24)은 위생 관리 7개 항목만 둔다(R2).
    - 의무가 없으면 학교가 스스로 하지 않나? 식단 제한 대응은 학교 자율인데, 서울대도 2018년에야 식당 한 곳에 할랄 메뉴를 들였고 식재료·관리비 때문에 적자로 운영한다(R4). 비용을 학교가 떠안아야 해서 대응이 넓게 퍼지기 어렵다. 그래서 의무도 지원도 없는 학식당에서는 먹는 사람이 숨은 재료를 판단할 수단이 없다.
solution_paths:
  - path: 메뉴판·음식 사진에서 메뉴를 읽고 숨은 재료를 추정해, 내 식단 제한 기준으로 3단계 판정한다
    status: chosen
    reason: |-
      메뉴판에는 요리 이름만 있고 학식당은 원재료를 알려 줄 의무가 없어(R2, E1·E2), 먹는 사람이 직접 판단할 수단이 필요하다.
      사진 한 장이면 한국어를 몰라도 메뉴를 넣을 수 있고, 숨은 재료 추론(REQ-5)으로 이름에 안 보이는 양념까지 본다.
      판정은 AI가 아니라 정해진 규칙(R0~R4)이 해서 같은 메뉴는 늘 같은 결과와 근거가 나온다. AI는 사진 판독과 재료 추정에만 쓴다.
      검토했지만 고르지 않은 방법:
      - 학식당에 원재료·알레르기 표시를 요청: 표시 의무가 없어(R2) 강제할 수 없고, 학교마다 운영을 바꿔야 해서 학생이 만들 수 있는 해법이 아니다.
      - 메뉴판을 외국어로 번역하는 앱: 이름만 바뀌고 고추장·양념장 속 재료는 그대로 안 보인다(대안 3, E1·E2).
      - 학식당에 할랄·채식 전용 코너를 만들기: 할랄 메뉴는 식재료·관리비 때문에 적자로 운영돼(R4) 학교가 비용을 떠안아야 하고, 알레르기(P2)는 해결하지 못한다.
insight:
  claim: 외국인 유학생은 메뉴 이름이 아니라, 고추장·양념장처럼 이름에 드러나지 않는 재료 때문에 식사를 포기한다.
  evidence: |-
    E1: 비빔밥 자체는 먹을 수 있었지만, 고추장에 돼지고기가 들어 있는지 몰라 포기했다.
    E2: 비빔국수 자체는 먹을 수 있었지만, 양념장에 땅콩이 들어 있는지 몰라 포기했다.
    E3: 토스트·햄버거 이름만 보고 토마토·계란이 없을 줄 알았지만 들어 있어, 버리거나 빼 달라고 해야 했다(팀원 A 본인 경험).
    세 경우 모두 메뉴 이름만으로는 판단할 수 없었다. 특히 대학 학식당은 원재료·알레르기 표시 의무도 없다(R2, R5).
  design_decision: |-
    메뉴 이름만 번역해서는 E1·E2를 풀 수 없다. 양념·육수 속 숨은 재료까지 추정해서(REQ-5) 내 식단 제한 기준으로 안전 / 확인 필요 / 불가를 나누고(REQ-3), 왜 그런지 재료 단위로 보여 준다(REQ-6).
    학식당 레시피를 모르는 메뉴는 우리도 '불가'라고 단정하지 못하고 '확인 필요'까지만 말할 수 있다. 대신 어떤 재료가 문제인지 메뉴판과 같은 한국어로 짚어 주기 때문에, 유학생은 "고추장에 돼지고기 들어가요?"처럼 그 재료 하나만 직원에게 물어보거나 같은 메뉴판의 안전한 메뉴를 고르면 된다.
    안전한 메뉴가 하나도 없으면 다른 음식점을 추천한다(OPT-2).
# 기능의 원본. 2026-10-29 팀이 합의한 기능 명세서(REQ-1~7 주요, OPT-1~3 부가)를 옮겼고, 같은 날 REQ-8(영어 화면)을 더했다.
# 주요(MVP)는 REQ-1~8, 부가는 OPT-1~3이다. REQ를 먼저, OPT를 뒤에 둔다.
# 나눈 기준(2026-10-30): REQ는 E1·E2 같은 메뉴를 사진 한 장으로 판정하고 근거까지 보여 주는 핵심 흐름(S6·S7)에 꼭 필요한 기능이다. OPT는 없어도 그 흐름으로 문제와 해법을 보여 줄 수 있는 기능이다.
# 부가지만 MVP 흐름이 기대는 곳: REQ-2 판독 실패 시 OPT-1 입력칸이 나오고, 배포 프록시의 본문 4.5MB 제한(tech-stack.md 열린 결정 2) 아래에서 REQ-1의 10MB 한도는 OPT-3 축소로 지켜진다.
# 프로필 전환은 뺐다. 로그인 없이 서버가 Auto Increment로 발급한 user_id로 사용자를 구분한다.
# API는 docs/api.md, 판정 규칙(R0~R4)은 docs/api.md > REQ-3에 있다.
features:
  - id: REQ-1 # 주요
    name: 사진 업로드
    input: 파일 선택, 드래그 앤 드롭, 모바일 카메라 촬영으로 고른 사진
    output: 올린 사진이 메뉴 판독(REQ-2)으로 넘어간다
    done: JPEG·PNG·WEBP 사진(10MB 이하)을 파일 선택·드래그 앤 드롭·모바일 카메라 촬영 중 어느 방법으로 올려도 메뉴 판독이 시작된다. 사진을 고르지 않았거나, 지원하지 않는 형식이거나, 10MB를 넘으면 업로드되지 않고 이유를 알리는 영어 문구가 보인다(문구는 docs/api.md > REQ-1 > 예외 상황).
  - id: REQ-2 # 주요
    name: 메뉴 판독
    input: 메뉴판 사진 또는 음식 사진
    output: 메뉴판 사진이면 메뉴 이름 전부, 음식 사진이면 요리명 1개
    done: 메뉴판 사진을 올리면 적힌 메뉴 이름이 모두, 음식 사진을 올리면 요리명 1개가 나온다. 읽지 못한 항목은 추측하지 않고 비워 둔다. 메뉴를 하나도 읽지 못하거나, 메뉴판·음식 사진이 아니거나, 판독이 실패하거나 45초 안에 끝나지 않으면 메뉴 이름 입력칸(OPT-1)이 나타난다.
  - id: REQ-3 # 주요
    name: 위험 정도 3단계 판정과 근거
    input: 음식 이름, 식단 제한 프로필
    output: 메뉴마다 안전(Safe)·확인 필요(Check first)·불가(Avoid) 중 하나의 배지와 판정 근거
    done: 음식 이름이 있으면 메뉴마다 안전·확인 필요·불가 중 하나의 배지와 근거 한 줄이 보인다. 판정 규칙은 docs/api.md > REQ-3 > 판정 규칙을 따른다. 식단 제한을 저장하지 않은 사용자는 모든 메뉴가 안전(R0)으로 나온다. 음식 이름이 비어 있으면(null 또는 빈 문자열) 판정하지 않고 "Please enter a menu name." 팝업이 뜬다.
  - id: REQ-4 # 주요
    name: 식단 제한 설정
    input: 프리셋(할랄, 채식, 비건)과 토글(고기, 돼지고기, 소고기, 해산물, 계란, 우유·유제품, 땅콩, 술) 선택
    output: 제한 음식이 설정된 식단 제한 프로필
    done: 프리셋이나 토글을 누르고 저장하면 제한 음식 설정이 바뀌고, 이후 판정(REQ-3)에 그 프로필이 쓰인다. 설정 화면을 다시 열면 저장한 프리셋·토글이 그대로 켜져 있고, 저장한 적이 없으면 모든 토글이 꺼져 있다(제한 없음). 같은 사용자의 저장 요청이 동시에 들어오면 먼저 온 요청만 반영하고, 나중 요청은 저장되지 않으며 "Another request was saved first. Please try again."이 보인다. 채식은 고기·해산물을 빼고 계란·유제품은 허용하며, 비건은 계란·유제품까지 뺀다. 알레르기는 프리셋 없이 토글로 고른다.
  - id: REQ-5 # 주요
    name: 숨은 성분 추론
    input: 음식 이름
    output: 재료 목록과 재료마다 확인/추정 구분·출처. 음식 DB → 이름 속 재료 단어·조리법 추정 → 만개의 레시피 검색(DB에 없을 때) → AI 추정(거기에도 없을 때) 순으로 찾는다
    done: 음식 이름을 넣으면 이름에 들어 있는 재료 단어와 조리법으로 추정한 재료가 판정 근거에 쓰인다. 음식 DB에 없는 메뉴는 만개의 레시피에서 검색해 찾아온 재료로 추정하고, 만개의 레시피에도 없거나 검색이 실패하면 AI가 재료를 추정한다. AI 추정만으로는 '불가'가 나오지 않고, 재료가 모두 AI 추정이면 식단 제한이 있는 사용자에게 '확인 필요'가 나온다. 어디에서도 재료를 찾지 못하면 재료 목록이 비고, 식단 제한이 있는 사용자에게는 '확인 필요'가 나온다. 어느 경우에도 '등록되지 않은 메뉴' 팝업은 띄우지 않는다. 재료를 어디서 찾았는지는 근거 상세의 "Source" 열에 보인다("10000recipe"·"AI estimate" 등). 찾아온 재료를 음식 DB에 저장해 다시 검색하지 않는 방식은 docs/api.md > REQ-5 > 찾는 순서를 따른다.
  - id: REQ-6 # 주요
    name: 근거 상세
    input: 판정 결과(REQ-3)
    output: 성분별 확인/추정 구분, 확신도, 적용 규칙
    done: 판정 화면에서 메뉴를 누르면 성분마다 확인/추정 구분("Confirmed"·"Estimated"), 확신도("High"·"Medium"·"Low"), 적용된 규칙("Rule")이 보인다. 누른 뒤 따로 불러오는 시간 없이 바로 보인다(근거 상세는 판정 응답에 함께 들어 있다).
  - id: REQ-7 # 주요
    name: 고지 문구
    input: null
    output: 화면 하단의 고지 문구
    done: 모든 화면 하단에 "For guidance only. Please make the final check yourself or with a dietitian."(판정 보조이며, 최종 확인은 본인과 영양사에게)가 항상 보인다.
  - id: REQ-8 # 주요
    name: 영어 화면
    input: null
    output: 영어로 된 모든 화면 문구(버튼·배지·근거·팝업·고지 문구). 메뉴·재료 이름은 메뉴판의 한국어 원문 그대로
    done: 모든 화면의 버튼·배지·판정 근거·팝업·고지 문구가 영어로 보인다. 메뉴와 재료 이름은 메뉴판에 적힌 한국어 원문 그대로 보여, 학식당의 한국어 메뉴판과 대조하고 직원에게 그대로 보여 줄 수 있다. 문구는 docs/api.md > 화면 문구를 따른다. 한국어 화면은 제공하지 않는다.
  - id: OPT-1 # 부가
    name: 수동 입력
    input: 메뉴명
    output: 사진 판정과 같은 엔진으로 낸 판정 결과
    done: 판독에 실패하면 메뉴 이름을 직접 입력할 수 있고, "Can I eat it?"을 누르면 사진 판정과 같은 배지와 근거가 나온다. 입력칸을 비운 채 누르면 판정하지 않고 "Please enter a menu name." 팝업이 뜬다. 음식 DB에 없는 메뉴도 REQ-5 순서로 재료를 찾아 판정한다.
  - id: OPT-2 # 부가
    name: 음식점 추천
    input: user_id
    output: 학식 대신 갈 수 있는 다른 음식점 추천
    done: 첫 화면에는 "Other restaurants"가 항상 있고, 판정 결과에 '안전' 메뉴가 하나도 없으면 판정 화면에도 "Other restaurants"가 나타난다. 누르면 내 식단 제한 항목을 모두 피하는 음식점이 보인다. 음식점 데이터는 시드(R__20)로 넣는다. 지금 시드는 이름 앞에 (예시)가 붙은 예시 데이터이고, 팀이 학교 주변 음식점을 조사해 바꾼다. 조건에 맞는 곳이 없으면 "No restaurants match your diet yet."가 보인다.
  - id: OPT-3 # 부가
    name: 이미지 축소
    input: 원본 이미지
    output: 전송 전 브라우저에서 긴 변 1400px, JPEG 품질 0.85로 줄인 이미지
    done: 휴대폰 카메라로 찍은 큰 사진(긴 변 1400px 이상)을 "Upload photo"로 올려도 업로드 한도에 막히지 않고 판정 화면까지 간다. 축소 기준(긴 변 1400px, JPEG 품질 0.85, 1400px 미만은 그대로)은 output과 docs/api.md > OPT-3을 따른다.
