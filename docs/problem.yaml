# NULL 팀 문제정의. 2026-10-29 종이 문제정의 캔버스·체크리스트 원문을 옮김.
# 종이에 없는 내용은 null 또는 []로 남김.

statement: |-
  외국인유학생은 학식당에서 원재료를 정확히 알 수 없는 문제때문에 자신의 신념이나 건강에 맞는지 불확실함을 겪는다.
  지금은 익숙한 음식만 먹는 방법으로 버티지만 먹을 수 있는 음식의 종류가 제한된다.
canvas:
  context: 식사시간에 대학교 교내에서 매 식사메뉴를 선택할 때 일어난다.
  customer: |-
    한국 음식에 익숙치 않은 외국인 유학생
    건강적/종교적/신념적 이유로 식단이 제한되는 외국인 유학생
    특정 음식을 못 먹는 사람
  root_problem: |-
    학식당 원재료 표기가 한국어/한국음식에 익숙하지 않은 사람에게는 찾기힘들거나 익숙치 않다.
    외국인 유학생의 급격한 증가로 기반이 아직 마련되지 못했다.
  impact:
    feeling: 두려움, 배제 되는 느낌
    measurable: 저렴한 가격으로 학식을 먹을 기회
  alternatives:
    - how_used: 아는 음식이나 가던 곳만 간다.
      shortcoming: 먹는 음식의 다양성 감소
      why_ours: |-
        몇 초 안에 '먹을지 말지'를 정해 준다 (대안 1·2 대응)
        대안 1은 선택지를, 대안 2는 외식의 즉시성을 포기하는 방식입니다. 두 대안의 진짜 비용은 "안전한 한 끼를 얻기 위해 매번 투입해야 하는 탐색·조리 시간"입니다.
        메뉴판이나 성분표를 촬영 1회로 안전 / 주의 / 위험 3단계 판정을 즉시 제공합니다.
        처음 가는 식당, 처음 보는 음식도 그 자리에서 결정할 수 있습니다.
        따라서 3단계 위험도는 "직접 해 먹기"의 대체재가 아니라, 대안 1·2가 강요하는 탐색 비용 자체를 제거하는 장치입니다.
    - how_used: 직접 해먹는다.
      shortcoming: 번거로움, 식재료를 구하기 힘들다.
      why_ours: |-
        몇 초 안에 '먹을지 말지'를 정해 준다 (대안 1·2 대응)
        대안 1은 선택지를, 대안 2는 외식의 즉시성을 포기하는 방식입니다. 두 대안의 진짜 비용은 "안전한 한 끼를 얻기 위해 매번 투입해야 하는 탐색·조리 시간"입니다.
        메뉴판이나 성분표를 촬영 1회로 안전 / 주의 / 위험 3단계 판정을 즉시 제공합니다.
        처음 가는 식당, 처음 보는 음식도 그 자리에서 결정할 수 있습니다.
        따라서 3단계 위험도는 "직접 해 먹기"의 대체재가 아니라, 대안 1·2가 강요하는 탐색 비용 자체를 제거하는 장치입니다.
    - how_used: 사전에 파파고·ChatGPT 등으로 미리 조사해 확인하고 간다.
      shortcoming: |-
        부정확함, 번거로움
        파파고는 이름만 번역할 뿐 나에게 안전한지는 알려 주지 않고, ChatGPT는 같은 질문에도 답이 달라지거나 근거 없이 확신하며 매번 식이 조건을 다시 설명해야 한다.
      why_ours: |-
        번역이 아니라 '내 기준'으로 판단한다 (대안 3 대응)
        파파고: "된장찌개 = soybean paste stew"처럼 이름만 치환할 뿐, 나에게 안전한지는 알려 주지 않습니다.
        ChatGPT: 같은 질문에도 답이 달라질 수 있고, 근거 없이 확신하는 답을 내놓기도 하며, 매번 알레르기·식이 조건을 다시 설명해야 합니다.
        우리 앱: 사용자 프로필(알레르기, 할랄, 비건 등)을 저장해 항상 동일한 기준으로 판정하고, 어떤 성분 때문에 위험한지 근거를 함께 제시하며, '확인 필요'일 때는 매장에 그대로 보여줄 문의 문장까지 제공합니다.
personas:
  - id: P1
    description: 외국인 유학생이 포함돼 있는 연구실
    source: 종이 기록
experiences:
  - id: E1
    when: 연구실 단체 회식 장소를 정하고 식사를 준비하던 날
    what_happened: |-
      보통 많이 도시락을 싸서 다니고 회식을 한참을 알아본 뒤에 회식장소를 정할수있다.
      돼지고기 포함되지 않은 걸 먹어야 하는게 짜증난다.
    workaround: 도시락을 싸서 다니고, 회식장소는 한참을 알아본 뒤에 정한다.
    feeling: 짜증난다
    quote: "한국 식당은 메뉴판만 봐선 돼지고기나 돈골 육수 사용 여부를 알 수 없어요. 회식할 때마다 내가 먹을 수 있는 안전한 음식을 일일이 검증하고 찾으러 다니는 게 너무 힘들고 스트레스였습니다."
    source: 종이 기록 + 학생 보강 (대학원 연구실 소속 무슬림 외국인 유학생의 경험)
  - id: E2
    when: null
    what_happened: |-
      학식당에서 채소 위주의 비빔밥이라 당연히 안전할 줄 알았는데, 양념인 고추장에 다진 소고기나 소고기 베이스 성분이 포함되어 있는지 알 길이 없었다.
      학식당은 성분 표기가 의무가 아니라서 직원조차 정확히 모른다고 했다.
    workaround: 위험을 감수할 수 없어 식사를 포기하고 나왔다.
    feeling: null
    quote: "채소 위주의 비빔밥이라 당연히 안전할 줄 알았는데, 양념인 고추장에 다진 소고기나 소고기 베이스 성분이 포함되어 있는지 알 길이 없었습니다. 학식당은 성분 표기가 의무가 아니라서 직원조차 정확히 모른다고 했고, 결국 위험을 감수할 수 없어 식사를 포기한 채 나와야 했습니다."
    source: 학생 제공 (누가 겪은 일인지 미기재)
sources:
  - id: R1
    url: https://www.immigration.go.kr/moj/2412/subview.do
    title: 법무부 출입국·외국인정책본부 체류외국인 현황 (유학생 현황)
    claim: 국내 체류 외국인 유학생은 2022년 197,234명, 2025년 308,838명(2025년 말 기준)이다.
five_whys:
  symptom: 학식의 원재료를 파악하기 어렵다.
  whys:
    - 성분 표시가 의무가 아니다.
    - 법이 제정되어 있지 않다.
    - 알레르기/신념에 따른 거부를 많이 겪지 않았다.
    - 외국인 유학생이 3년 동안 급격히 증가했기 때문이다.
    - 한류의 영향이 크다.
solution_paths:
  - path: AI를 이용한 원재료 분석 솔루션 / 위험도 평가 솔루션
    status: chosen
    reason: 빠르고 간편하게 확인할 수 있다.
insight:
  claim: 식사를 못하는 외국인 유학생
  evidence: 종교 이유로 먹지 못했던 사례가 있었다.
  design_decision: 사진 한장으로 먹을 수 있는지 위험도를 [안전(가능) / 확인 필요(주의) / 섭취 불가] 3단계로 보여주는 AI 솔루션
# features는 2026-10-29 팀 기능 명세 문서 "학식 식단 제한 체커 — 기능 명세"에서 옮김.
# 출력 스키마: { menu, verdict(안전|확인 필요|불가), reason, hidden_ingredients, confidence(high|medium|low) }
features:
  - id: F1
    name: 사진 업로드
    input: 파일 선택, 드래그, 모바일 카메라 촬영(capture="environment") 중 하나로 고른 메뉴판 또는 음식 사진
    output: 사진이 축소(F2)를 거쳐 판독 요청(POST /api/scan)으로 전송된다
    done: 파일 선택·드래그·모바일 카메라 촬영 중 어느 방법으로 올려도 판독이 시작된다.
  - id: F2
    name: 이미지 축소
    input: 업로드한 사진
    output: 브라우저에서 긴 변 1400px, JPEG 품질 0.85로 줄인 사진이 서버로 전송된다
    done: 긴 변이 1400px보다 큰 사진을 올리면 서버로 가는 이미지는 긴 변 1400px 이하의 JPEG다. 12MB를 넘는 요청은 받지 않는다.
  - id: F3
    name: 메뉴 판독(비전)
    input: 축소된 사진
    output: 메뉴판이면 메뉴 이름 전부, 음식 사진이면 요리명 1개
    done: 메뉴판 사진은 메뉴 이름 목록(한 번에 최대 15개)이, 음식 사진은 요리명 1개가 나온다. 못 읽은 이름은 추측하지 않고 비워서 반환하며, 같은 사진(sha256)은 30분 동안 다시 판독하지 않는다.
  - id: F4
    name: 숨은 성분 추론
    input: 메뉴 이름
    output: 메뉴별 추정 성분(육수·소스·가공품 포함)과 성분별 확신도(high·medium·low)
    done: 큐레이션 메뉴 13종(설렁탕, 김치찌개, 계란말이, 잡채, 순두부찌개, 콩나물국, 치킨까스, 크림파스타, 버섯리조또, 어묵국, 마라탕, 그린샐러드, 오므라이스)은 큐레이션 데이터를 먼저 쓰고, 그 밖의 메뉴는 이름의 재료 단어와 조리법으로 성분을 추정한다. 이름에 적힌 재료는 "확인", 추론한 재료는 "추정"으로 구분된다.
  - id: F5
    name: 3단계 판정
    input: 메뉴 이름 목록 전체와 식단 제한 프로필
    output: 메뉴마다 안전·확인 필요·불가 배지와 근거 한 줄(출력 스키마 형식)
    done: |-
      아래 순서로 처음 걸리는 조건이 결과가 된다.
      1) 직접 입력한 성분과 일치 → 불가
      2) 제한 성분이 이름에 있음(high) 또는 조리 관행상 거의 확실(medium) → 불가
      3) 제한 성분이 가능성 수준(low)뿐 → 확인 필요
      4) 조리법 경고(튀김옷, 양념, 선택식 등)에 해당 → 확인 필요
      5) 성분 근거를 하나도 못 찾음 → 확인 필요
      6) 위 어디에도 해당하지 않음 → 안전
      예: 채식 프로필에서 설렁탕은 "불가", 근거 "소고기 확인 — 채식 제한(고기)"로 나온다.
      reason이 비어 있는 응답은 버리고, LLM이 low 확신도로 안전을 내면 확인 필요로 낮춘다. LLM이 8초 안에 답하지 않거나 스키마 검증에 실패한 메뉴는 로컬 규칙 엔진 결과로 바꾼다.
  - id: F6
    name: 프로필 전환
    input: 판정 화면의 프로필 탭(알레르기·할랄·채식)
    output: 같은 메뉴 목록 전체가 새 프로필 기준으로 다시 판정된다
    done: 탭을 한 번 누르면 사진을 다시 읽지 않고(POST /api/judge-names) 모든 메뉴의 배지와 근거가 새 프로필 기준으로 바뀐다.
  - id: F7
    name: 판정 근거 상세
    input: 판정 화면에서 고른 메뉴
    output: 추정 성분 내역(확인/추정 구분), 확신도, 적용된 판정 규칙
    done: 메뉴를 누르면 상세 화면에 성분별 확인/추정 구분, 확신도, 적용 규칙 번호가 보인다.
  - id: F8
    name: 식단 제한 설정
    input: 프리셋 3종(알레르기·할랄·채식), 9개 그룹(계란, 우유, 견과, 돼지고기, 술, 젤라틴, 고기, 생선·해산물, 육수) 토글, 직접 입력 성분
    output: 판정에 쓰이는 식단 제한 프로필
    done: 알레르기 프리셋은 계란·우유·견과, 할랄 프리셋은 돼지고기(햄·소시지·베이컨 포함)·술·젤라틴, 채식 프리셋은 고기 전부·생선·해산물·육수 전부가 켜진다. 9개 그룹은 자유롭게 조합할 수 있고, 직접 입력 성분은 20개까지만 추가된다.
  - id: F9
    name: 수동 입력 폴백
    input: 판독에 실패했을 때 직접 입력한 메뉴 이름
    output: 사진 판정과 같은 엔진·형식의 판정 결과
    done: 사진에서 메뉴를 하나도 읽지 못하면 이름 입력칸이 나타나고, 이름을 입력하면 사진 판정과 같은 배지와 근거가 나온다.
  - id: F10
    name: 고지 문구
    input: null
    output: 화면 하단의 고지 문구
    done: 모든 화면 하단에 "판정 보조이며, 최종 확인은 본인과 영양사에게."가 항상 보인다.
  - id: F11
    name: 음식점 추천
    input: null # 팀 명세 문서에 설명 없음
    output: null
    done: null
