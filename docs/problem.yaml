# NULL 팀 문제정의. 2026-10-29 종이 문제정의 캔버스·체크리스트 원문을 옮김.
# 종이에 없는 내용은 null 또는 []로 남김.

statement: |-
  외국인유학생은 학식당에서 원재료를 정확히 알 수 없는 문제때문에 자신의 신념이나 건강에 맞는지 불확실함을 겪는다.
  지금은 익숙한 음식만 먹는 방법으로 버티지만 먹을 수 있는 음식의 종류가 제한된다.
canvas:
  context: 식사시간에 대학교 교내에서 매 식사메뉴를 선택할 때 일어난다.
  customer: |-
    한국 음식에 익숙치 않은 외국인 유학생
    건강적/종교적/신념적 이유로 식단이 제한되는 외국인 유학생
    특정 음식을 못 먹는 사람
  root_problem: |-
    학식당 원재료 표기가 한국어/한국음식에 익숙하지 않은 사람에게는 찾기힘들거나 익숙치 않다.
    외국인 유학생의 급격한 증가로 기반이 아직 마련되지 못했다.
  impact:
    feeling: 두려움, 배제 되는 느낌
    measurable: 저렴한 가격으로 학식을 먹을 기회
  alternatives:
    - how_used: 아는 음식이나 가던 곳만 간다.
      shortcoming: 먹는 음식의 다양성 감소
      why_ours: |-
        몇 초 안에 '먹을지 말지'를 정해 준다 (대안 1·2 대응)
        대안 1은 선택지를, 대안 2는 외식의 즉시성을 포기하는 방식입니다. 두 대안의 진짜 비용은 "안전한 한 끼를 얻기 위해 매번 투입해야 하는 탐색·조리 시간"입니다.
        메뉴판이나 음식 사진 촬영 1회로 안전 / 확인 필요 / 불가 3단계 판정을 즉시 제공합니다.
        처음 보는 학식 메뉴도 그 자리에서 결정할 수 있습니다.
        따라서 3단계 위험도는 "직접 해 먹기"의 대체재가 아니라, 대안 1·2가 강요하는 탐색 비용 자체를 제거하는 장치입니다.
    - how_used: 직접 해먹는다.
      shortcoming: 번거로움, 식재료를 구하기 힘들다.
      why_ours: |-
        몇 초 안에 '먹을지 말지'를 정해 준다 (대안 1·2 대응)
        대안 1은 선택지를, 대안 2는 외식의 즉시성을 포기하는 방식입니다. 두 대안의 진짜 비용은 "안전한 한 끼를 얻기 위해 매번 투입해야 하는 탐색·조리 시간"입니다.
        메뉴판이나 음식 사진 촬영 1회로 안전 / 확인 필요 / 불가 3단계 판정을 즉시 제공합니다.
        처음 보는 학식 메뉴도 그 자리에서 결정할 수 있습니다.
        따라서 3단계 위험도는 "직접 해 먹기"의 대체재가 아니라, 대안 1·2가 강요하는 탐색 비용 자체를 제거하는 장치입니다.
    - how_used: 사전에 파파고·ChatGPT 등으로 미리 조사해 확인하고 간다.
      shortcoming: |-
        부정확함, 번거로움
        파파고는 이름만 번역할 뿐 나에게 안전한지는 알려 주지 않고, ChatGPT는 같은 질문에도 답이 달라지거나 근거 없이 확신하며 매번 식이 조건을 다시 설명해야 한다.
      why_ours: |-
        번역이 아니라 '내 기준'으로 판단한다 (대안 3 대응)
        파파고: "된장찌개 = soybean paste stew"처럼 이름만 치환할 뿐, 나에게 안전한지는 알려 주지 않습니다.
        ChatGPT: 같은 질문에도 답이 달라질 수 있고, 근거 없이 확신하는 답을 내놓기도 하며, 매번 알레르기·식이 조건을 다시 설명해야 합니다.
        우리 앱: 사용자 프로필(알레르기, 할랄, 채식 등)을 저장해 항상 동일한 기준으로 판정하고, 어떤 성분 때문에 위험한지 근거를 함께 제시합니다.
personas:
  - id: P1
    description: 종교적 이유로 돼지고기를 먹지 못하는 이슬람 유학생
    source: 학생 제공 (2026-10-29 채팅), E1 근거
  - id: P2
    description: 땅콩 알레르기가 있는 외국인 유학생
    source: 학생 제공 (2026-10-29 채팅)
experiences:
  - id: E1
    when: 연구실 단체 회식 장소를 정하고 식사를 준비하던 날
    what_happened: |-
      보통 많이 도시락을 싸서 다니고 회식을 한참을 알아본 뒤에 회식장소를 정할수있다.
      돼지고기 포함되지 않은 걸 먹어야 하는게 짜증난다.
    workaround: 도시락을 싸서 다니고, 회식장소는 한참을 알아본 뒤에 정한다.
    feeling: 짜증난다
    quote: "한국 식당은 메뉴판만 봐선 돼지고기나 돈골 육수 사용 여부를 알 수 없어요. 회식할 때마다 내가 먹을 수 있는 안전한 음식을 일일이 검증하고 찾으러 다니는 게 너무 힘들고 스트레스였습니다."
    source: 종이 기록 + 학생 보강 (대학원 연구실 소속 무슬림 외국인 유학생의 경험)
  - id: E2
    when: null
    what_happened: |-
      학식당에서 채소 위주의 비빔밥이라 당연히 안전할 줄 알았는데, 양념인 고추장에 다진 소고기나 소고기 베이스 성분이 포함되어 있는지 알 길이 없었다.
      학식당은 성분 표기가 의무가 아니라서 직원조차 정확히 모른다고 했다.
    workaround: 위험을 감수할 수 없어 식사를 포기하고 나왔다.
    feeling: null
    quote: "채소 위주의 비빔밥이라 당연히 안전할 줄 알았는데, 양념인 고추장에 다진 소고기나 소고기 베이스 성분이 포함되어 있는지 알 길이 없었습니다. 학식당은 성분 표기가 의무가 아니라서 직원조차 정확히 모른다고 했고, 결국 위험을 감수할 수 없어 식사를 포기한 채 나와야 했습니다."
    source: 학생 제공 (누가 겪은 일인지 미기재)
sources:
  - id: R1
    url: https://www.immigration.go.kr/moj/2412/subview.do
    title: 법무부 출입국·외국인정책본부 체류외국인 현황 (유학생 현황)
    claim: 국내 체류 외국인 유학생은 2022년 197,234명, 2025년 308,838명(2025년 말 기준)이다.
  - id: R2
    url: https://www.law.go.kr/법령/식품위생법시행규칙
    title: 식품위생법 시행규칙 제95조·[별표 24] 집단급식소의 설치ㆍ운영자 준수사항 (총리령 제2150호, 2026. 9. 1. 시행)
    claim: |-
      대학 식당 같은 집단급식소 설치·운영자의 준수사항은 제95조제3항에 따라 별표 24로 정한다.
      별표 24는 주방용구 소독, 배식하고 남은 음식물 재사용 금지, 검수·조리 위생관리 점검 기록(3개월 보관), 지하수 수질검사, 동물 내장 조리 기구 세척·살균, 모범업소 표시 제한, 당일 구입 빵류·과자류·떡류 거래명세서 보관(6개월)의 7개 항목만 두고, 알레르기·원재료 표시 조항은 없다.
five_whys:
  symptom: 학식의 원재료를 파악하기 어렵다.
  whys:
    - 성분 표시가 의무가 아니다. (R2)
    - 법이 제정되어 있지 않다. (R2)
    - 알레르기/신념에 따른 거부를 많이 겪지 않았다.
    - 외국인 유학생이 3년 동안 급격히 증가했기 때문이다.
    - 한류의 영향이 크다.
solution_paths:
  - path: AI를 이용한 원재료 분석 솔루션 / 위험도 평가 솔루션
    status: chosen
    reason: 빠르고 간편하게 확인할 수 있다.
insight:
  claim: 식사를 못하는 외국인 유학생
  evidence: 종교 이유로 먹지 못했던 사례가 있었다.
  design_decision: 사진 한장으로 먹을 수 있는지 위험도를 [안전 / 확인 필요 / 불가] 3단계로 보여주는 AI 솔루션
# features는 2026-10-29 팀이 합의한 기능 명세서(REQ-1~7 주요, OPT-1~3 부가)에서 옮김. 프로필 전환은 제외, 회원·로그인 없이 사용자는 서버가 Auto Increment로 발급한 user_id로 구분함.
# 2026-10-29 문서 통일: 이 features가 기능의 원본이다. API는 docs/api.md, 판정 규칙(R0~R4)은 docs/api.md > REQ-3에 있다.
features:
  - id: REQ-1 # 주요
    name: 사진 업로드
    input: 파일 선택, 드래그 앤 드롭, 모바일 카메라 촬영으로 고른 사진
    output: 올린 사진이 메뉴 판독(REQ-2)으로 넘어간다
    done: 파일 선택·드래그 앤 드롭·모바일 카메라 촬영 중 어느 방법으로 올려도 메뉴 판독이 시작된다.
  - id: REQ-2 # 주요
    name: 메뉴 판독
    input: 메뉴판 사진 또는 음식 사진
    output: 메뉴판 사진이면 메뉴 이름 전부, 음식 사진이면 요리명 1개
    done: 메뉴판 사진을 올리면 적힌 메뉴 이름이 모두, 음식 사진을 올리면 요리명 1개가 나온다. 읽지 못한 항목은 추측하지 않고 비워 둔다. 메뉴를 하나도 읽지 못하거나 메뉴판·음식 사진이 아니면 메뉴 이름 입력칸(OPT-1)이 나타난다.
  - id: REQ-3 # 주요
    name: 위험 정도 3단계 판정 (부가 기능 - 판정에 따른 근거 제공)
    input: 음식 이름, 식단 제한 프로필
    output: 메뉴마다 안전·확인 필요·불가 중 하나의 배지와 판정 근거
    done: 음식 이름이 있으면 메뉴마다 안전·확인 필요·불가 중 하나의 배지와 근거 한 줄이 보인다. 판정 규칙은 docs/api.md > REQ-3 > 판정 규칙을 따른다. 음식 이름이 비어 있으면(null 또는 빈 문자열) 판정하지 않고 '입력 값이 없습니다.' 팝업이 뜬다.
  - id: REQ-4 # 주요
    name: 식단 제한 설정
    input: 프리셋(할랄, 채식, 비건)과 토글(고기, 돼지고기, 소고기, 해산물, 계란, 우유·유제품, 땅콩, 술) 클릭(on-click)
    output: 제한 음식이 설정된 식단 제한 프로필
    done: 프리셋이나 토글을 누르고 저장하면 제한 음식 설정이 바뀌고, 이후 판정(REQ-3)에 그 프로필이 쓰인다. 같은 사용자의 저장 요청이 동시에 들어오면 먼저 온 요청만 반영하고 나중 요청에는 다시 시도하라고 알린다(version 불일치 → 409). 채식은 고기·해산물을 빼고 계란·유제품은 허용하며, 비건은 계란·유제품까지 뺀다. 알레르기는 프리셋 없이 토글로 고른다.
  - id: REQ-5 # 주요
    name: 숨은 성분 추론
    input: 음식 이름
    output: 재료마다 확인/추정 구분과 출처. 음식 DB → 이름 속 재료 단어·조리법 추정 → (DB에 없으면) 만개의 레시피 검색 → (거기에도 없으면) AI 추정 순으로 찾은 재료
    done: 음식 이름을 넣으면 이름에 들어 있는 재료 단어와 조리법으로 추정한 재료가 판정 근거에 쓰인다. 음식 DB에 없는 메뉴는 만개의 레시피에서 검색해 찾아온 재료로 추정하고, 만개의 레시피에도 없거나 검색이 실패하면 AI가 재료를 추정한다. AI 추정만으로 낸 판정은 '확인 필요'를 넘지 않는다. 어느 경우에도 '등록되지 않은 메뉴' 팝업은 띄우지 않는다. 찾아온 재료는 음식 DB에 저장해 같은 메뉴를 다시 검색하지 않는다.
  - id: REQ-6 # 주요
    name: 근거 상세
    input: 판정 결과(REQ-3)
    output: 성분별 확인/추정 구분, 확신도, 적용 규칙
    done: 판정 화면에서 메뉴를 누르면 성분마다 확인 또는 추정 구분, 확신도(높음·보통·낮음), 적용된 규칙이 보인다. 판정 응답에 이미 들어 있어 추가 요청 없이 보인다.
  - id: REQ-7 # 주요
    name: 고지 문구
    input: null # 입력 없음
    output: 화면 하단의 고지 문구
    done: 모든 화면 하단에 "판정 보조이며, 최종 확인은 본인과 영양사에게."가 항상 보인다.
  - id: OPT-1 # 부가
    name: 수동 입력
    input: 메뉴명
    output: 사진 판정과 같은 엔진으로 낸 판정 결과
    done: 판독에 실패하면 메뉴 이름을 직접 입력할 수 있고, "판정하기"를 누르면 사진 판정과 같은 배지와 근거가 나온다. 음식 DB에 없는 메뉴도 REQ-5 순서로 재료를 찾아 판정한다.
  - id: OPT-2 # 부가
    name: 음식점 추천
    input: user_id
    output: 학식 대신 갈 수 있는 다른 음식점 추천
    done: 판정 결과에 '안전' 메뉴가 하나도 없으면 판정 화면에 "다른 식당 보기"가 나타나고, 누르면 내 식단 제한 항목을 모두 피하는 음식점이 보인다. 음식점 데이터는 팀이 직접 조사한 학교 주변 음식점을 시드로 넣는다. 조건에 맞는 곳이 없으면 '조건에 맞는 음식점이 없습니다.'가 보인다.
  - id: OPT-3 # 부가
    name: 이미지 축소
    input: 원본 이미지
    output: 전송 전 브라우저에서 긴 변 1400px, JPEG 품질 0.85로 줄인 이미지
    done: 긴 변이 1400px 이상인 사진은 긴 변 1400px, JPEG 품질 0.85로 줄여 전송하고, 1400px 미만인 사진은 줄이지 않는다.
