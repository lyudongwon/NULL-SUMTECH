# NULL 팀 문제정의. 2026-10-29 종이 문제정의 캔버스·체크리스트 원문을 옮김.
# 종이에 없는 내용은 null 또는 []로 남김.

statement: |-
  외국인유학생은 학식당에서 원재료를 정확히 알 수 없는 문제때문에 자신의 신념이나 건강에 맞는지 불확실함을 겪는다.
  지금은 익숙한 음식만 먹는 방법으로 버티지만 먹을 수 있는 음식의 종류가 제한된다.
canvas:
  context: 식사시간에 대학교 교내에서 매 식사메뉴를 선택할 때 일어난다.
  customer: |-
    한국 음식에 익숙치 않은 외국인 유학생
    건강적/종교적/신념적 이유로 식단이 제한되는 외국인 유학생
    특정 음식을 못 먹는 사람
  root_problem: |-
    학식당 원재료 표기가 한국어/한국음식에 익숙하지 않은 사람에게는 찾기힘들거나 익숙치 않다.
    외국인 유학생의 급격한 증가로 기반이 아직 마련되지 못했다.
  impact:
    feeling: 두려움, 배제 되는 느낌
    measurable: 저렴한 가격으로 학식을 먹을 기회
  alternatives:
    - how_used: 아는 음식이나 가던 곳만 간다.
      shortcoming: 먹는 음식의 다양성 감소
      why_ours: |-
        몇 초 안에 '먹을지 말지'를 정해 준다 (대안 1·2 대응)
        대안 1은 선택지를, 대안 2는 외식의 즉시성을 포기하는 방식입니다. 두 대안의 진짜 비용은 "안전한 한 끼를 얻기 위해 매번 투입해야 하는 탐색·조리 시간"입니다.
        메뉴판이나 성분표를 촬영 1회로 안전 / 주의 / 위험 3단계 판정을 즉시 제공합니다.
        처음 가는 식당, 처음 보는 음식도 그 자리에서 결정할 수 있습니다.
        따라서 3단계 위험도는 "직접 해 먹기"의 대체재가 아니라, 대안 1·2가 강요하는 탐색 비용 자체를 제거하는 장치입니다.
    - how_used: 직접 해먹는다.
      shortcoming: 번거로움, 식재료를 구하기 힘들다.
      why_ours: |-
        몇 초 안에 '먹을지 말지'를 정해 준다 (대안 1·2 대응)
        대안 1은 선택지를, 대안 2는 외식의 즉시성을 포기하는 방식입니다. 두 대안의 진짜 비용은 "안전한 한 끼를 얻기 위해 매번 투입해야 하는 탐색·조리 시간"입니다.
        메뉴판이나 성분표를 촬영 1회로 안전 / 주의 / 위험 3단계 판정을 즉시 제공합니다.
        처음 가는 식당, 처음 보는 음식도 그 자리에서 결정할 수 있습니다.
        따라서 3단계 위험도는 "직접 해 먹기"의 대체재가 아니라, 대안 1·2가 강요하는 탐색 비용 자체를 제거하는 장치입니다.
    - how_used: 사전에 파파고·ChatGPT 등으로 미리 조사해 확인하고 간다.
      shortcoming: |-
        부정확함, 번거로움
        파파고는 이름만 번역할 뿐 나에게 안전한지는 알려 주지 않고, ChatGPT는 같은 질문에도 답이 달라지거나 근거 없이 확신하며 매번 식이 조건을 다시 설명해야 한다.
      why_ours: |-
        번역이 아니라 '내 기준'으로 판단한다 (대안 3 대응)
        파파고: "된장찌개 = soybean paste stew"처럼 이름만 치환할 뿐, 나에게 안전한지는 알려 주지 않습니다.
        ChatGPT: 같은 질문에도 답이 달라질 수 있고, 근거 없이 확신하는 답을 내놓기도 하며, 매번 알레르기·식이 조건을 다시 설명해야 합니다.
        우리 앱: 사용자 프로필(알레르기, 할랄, 비건 등)을 저장해 항상 동일한 기준으로 판정하고, 어떤 성분 때문에 위험한지 근거를 함께 제시하며, '확인 필요'일 때는 매장에 그대로 보여줄 문의 문장까지 제공합니다.
    - how_used: 글로벌 식품 성분 분석 앱으로 확인한다.
      shortcoming: 해외 바코드·해외 성분 DB를 기준으로 만들어져 한국 제품과 식당 메뉴에 취약하고, 메뉴 이름에 드러나지 않는 성분은 알 수 없다.
      why_ours: |-
        한국 음식의 '숨은 성분'까지 잡아낸다 (대안 4 대응)
        글로벌 앱은 해외 바코드·해외 성분 DB를 기준으로 만들어져 한국 제품과 식당 메뉴에는 취약합니다. 그런데 한국 음식은 메뉴 이름에 성분이 드러나지 않습니다.
        김치의 젓갈·새우젓, 국물의 멸치·소고기 육수, 양념의 다시다·맛술, 고추장 속 소고기처럼 이름만 봐서는 알 수 없는 원재료가 기본값입니다.
        우리 앱은 한국 메뉴·원재료·조리법 데이터를 기반으로 메뉴명 → 실제 투입 원재료 → 교차 오염까지 역추적해 판정합니다.
        결과적으로 글로벌 앱이 "알 수 없음"으로 비워 두는 구간에서 우리는 판정 자체를 제공합니다.
personas:
  - id: P1
    description: 외국인 유학생이 포함돼 있는 연구실
    source: 종이 기록
experiences:
  - id: E1
    when: 연구실 단체 회식 장소를 정하고 식사를 준비하던 날
    what_happened: |-
      보통 많이 도시락을 싸서 다니고 회식을 한참을 알아본 뒤에 회식장소를 정할수있다.
      돼지고기 포함되지 않은 걸 먹어야 하는게 짜증난다.
    workaround: 도시락을 싸서 다니고, 회식장소는 한참을 알아본 뒤에 정한다.
    feeling: 짜증난다
    quote: "한국 식당은 메뉴판만 봐선 돼지고기나 돈골 육수 사용 여부를 알 수 없어요. 회식할 때마다 내가 먹을 수 있는 안전한 음식을 일일이 검증하고 찾으러 다니는 게 너무 힘들고 스트레스였습니다."
    source: 종이 기록 + 학생 보강 (대학원 연구실 소속 무슬림 외국인 유학생의 경험)
  - id: E2
    when: null
    what_happened: |-
      학식당에서 채소 위주의 비빔밥이라 당연히 안전할 줄 알았는데, 양념인 고추장에 다진 소고기나 소고기 베이스 성분이 포함되어 있는지 알 길이 없었다.
      학식당은 성분 표기가 의무가 아니라서 직원조차 정확히 모른다고 했다.
    workaround: 위험을 감수할 수 없어 식사를 포기하고 나왔다.
    feeling: null
    quote: "채소 위주의 비빔밥이라 당연히 안전할 줄 알았는데, 양념인 고추장에 다진 소고기나 소고기 베이스 성분이 포함되어 있는지 알 길이 없었습니다. 학식당은 성분 표기가 의무가 아니라서 직원조차 정확히 모른다고 했고, 결국 위험을 감수할 수 없어 식사를 포기한 채 나와야 했습니다."
    source: 학생 제공 (누가 겪은 일인지 미기재)
sources:
  - id: R1
    url: https://www.immigration.go.kr/moj/2412/subview.do
    title: 법무부 출입국·외국인정책본부 체류외국인 현황 (유학생 현황)
    claim: 국내 체류 외국인 유학생은 2022년 197,234명, 2025년 308,838명(2025년 말 기준)이다.
five_whys:
  symptom: 학식의 원재료를 파악하기 어렵다.
  whys:
    - 성분 표시가 의무가 아니다.
    - 법이 제정되어 있지 않다.
    - 알레르기/신념에 따른 거부를 많이 겪지 않았다.
    - 외국인 유학생이 3년 동안 급격히 증가했기 때문이다.
    - 한류의 영향이 크다.
solution_paths:
  - path: AI를 이용한 원재료 분석 솔루션 / 위험도 평가 솔루션
    status: chosen
    reason: 빠르고 간편하게 확인할 수 있다.
insight:
  claim: 식사를 못하는 외국인 유학생
  evidence: 종교 이유로 먹지 못했던 사례가 있었다.
  design_decision: 사진 한장으로 먹을 수 있는지 위험도를 [안전(가능) / 확인 필요(주의) / 섭취 불가] 3단계로 보여주는 AI 솔루션
# features는 2026-10-29 docs/scenarios.yaml(woo9039 작성)의 흐름에서 옮김.
features:
  - id: F1
    name: 언어 선택
    input: 첫 화면(언어 선택)에서 고른 언어(예 English, 한국어)와 "다음" 버튼
    output: 이후 앱 화면과 버튼이 고른 언어로 표시되고, 고른 언어가 브라우저에 저장된다
    done: English를 고르고 "Next"를 누르면 식단 제한 선택 화면이 영어로 표시되고 Religion, Vegetarian, Allergy, Other 4개 카테고리가 보인다.
  - id: F2
    name: 식단 제한 설정
    input: 카테고리(종교·채식·알레르기·기타)별로 펼쳐진 세부 항목 선택(예 이슬람교, 락토 베지테리언, 땅콩, 고수)과 "완료" 버튼
    output: 고른 식단 제한이 로그인 없이 브라우저에 저장되고 홈 화면으로 이동한다
    done: 이슬람교·락토 베지테리언·땅콩·고수를 고르고 "완료"를 누르면 홈 화면에 "사진으로 확인하기", "오늘의 학식", "나와 비슷한 사용자의 추천 음식"이 보이고, 내 식단 제한에 네 항목이 저장돼 있다.
  - id: F3
    name: 사진으로 음식 확인
    input: 홈 화면 "사진으로 확인하기" → "사진 찍기"로 올린 음식·메뉴판 사진(휴대폰에서는 카메라가 열림)
    output: 음식 확인 화면에 AI가 인식한 메뉴 이름과 관련 사진들이 보이고, "맞아요"/"아니에요"로 맞는지 확인받는다
    done: 제육볶음 사진을 올리면 음식 확인 화면에 "제육볶음"과 관련 사진들이 보인다. "아니에요"를 누르면 판정 화면으로 넘어가지 않고 사진 찍기 화면으로 돌아가 "다시 찍어 주세요" 안내와 "사진 찍기" 버튼이 보인다.
  - id: F4
    name: 메뉴 이름으로 음식 확인
    input: 홈 화면 "메뉴 이름으로 확인하기" → 입력칸에 쓴 메뉴 이름(예 흰쌀밥)과 "확인" 버튼
    output: 음식 확인 화면에 입력한 메뉴 이름과 관련 사진들이 보이고, "맞아요"/"아니에요"로 맞는지 확인받는다
    done: 땅콩 알레르기로 설정하고 "흰쌀밥"을 입력해 "확인"을 누르면 음식 확인 화면에 "흰쌀밥"과 관련 사진들이 보인다.
  - id: F5
    name: 3단계 위험도 판정
    input: 음식 확인 화면에서 "맞아요"로 확정한 음식과 저장된 내 식단 제한
    output: 판정 화면에 "안전" / "확인 필요" / "섭취 불가" 중 하나와 그 이유가 보인다
    done: 이슬람교로 설정하고 제육볶음을 확정하면 "섭취 불가"와 돼지고기가 들어간다는 이유가 보인다. 이슬람교로 설정하고 김치찌개를 확정하면 "확인 필요"와 돼지고기가 들어가는 레시피와 안 들어가는 레시피가 있다는 설명이 보인다. 땅콩 알레르기로 흰쌀밥을 확정하면 "안전"이 보인다.
  - id: F6
    name: 점원에게 물어보기(한국어 질문 카드)
    input: '"확인 필요" 판정 화면에서 누른 "점원에게 물어보기" 버튼'
    output: 점원에게 보여 줄 한국어 질문 카드가 화면에 크게 뜬다
    done: 이슬람교 사용자가 김치찌개 "확인 필요" 판정에서 "점원에게 물어보기"를 누르면 "돼지고기"가 들어간 한국어 질문 문장이 담긴 카드가 크게 보인다.
  - id: F7
    name: 오늘의 학식
    input: 홈 화면에서 누른 "오늘의 학식"
    output: 오늘 날짜와 오늘의 학식 메뉴 목록이 보인다(메뉴는 시드 데이터)
    done: '"오늘의 학식"을 누르면 오늘 날짜와 시드 데이터에 넣은 오늘의 학식 메뉴 목록이 보인다.'
  - id: F8
    name: 나와 비슷한 사용자의 추천 음식
    input: 홈 화면에서 누른 "나와 비슷한 사용자의 추천 음식"과 저장된 내 식단 제한
    output: 나와 같은 식단 제한을 고른 다른 사용자가 추천한 음식 목록이 보인다(다른 사용자 데이터는 시드 데이터)
    done: 비건으로 설정하고 "나와 비슷한 사용자의 추천 음식"을 누르면 비건을 고른 시드 사용자가 추천한 음식 목록이 보인다.
