# 푸시·PR마다 백엔드 테스트, 화면 빌드, docker compose 실행과 스모크 테스트를 확인한다.
# 흐름 E2E(e2e/scenarios)는 ②의 /scan과 ③의 판정 API가 들어온 뒤 붙인다(docs/roles.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew --no-daemon test bootJar

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  compose:
    # 빈 DB에서 docker compose up --build만으로 2분 안에 뜨는지 확인한다(progress.md 3단계).
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start on an empty DB
        run: docker compose up -d
      - name: Wait for /__health (2 minutes)
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:3000/__health; then echo; exit 0; fi
            sleep 1
          done
          echo "app did not become healthy within 2 minutes"; exit 1
      - name: Check API through the app proxy
        run: |
          curl -fsS http://localhost:3000/api/v1/restrictions/presets | grep -q VEGETARIAN
          curl -fsS -X POST http://localhost:3000/api/v1/users | grep -q user_id
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Smoke test (Playwright)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --project=smoke
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
