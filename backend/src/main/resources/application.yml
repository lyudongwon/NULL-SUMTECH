spring:
  application:
    name: foodcheck
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/foodcheck}
    username: ${SPRING_DATASOURCE_USERNAME:foodcheck}
    password: ${SPRING_DATASOURCE_PASSWORD:foodcheck}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 표는 Flyway(db/migration)만 만든다
  flyway:
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE # api.md의 JSON 필드 이름(snake_case)과 맞춘다
  servlet:
    multipart:
      # REQ-1 사진 업로드 한도(decisions.md). Spring 기본값 1MB로는 사진이 막힌다.
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    openai:
      # base-url은 /v1까지 적는다. SDK가 뒤에 chat/completions만 붙여서, /v1이 없으면 404가 난다. 텍스트 호출은 확인했고 이미지(비전) 호출은 확인 전이다.
      api-key: ${AI_GATEWAY_API_KEY:unset}
      base-url: ${AI_GATEWAY_BASE_URL:https://ai-gateway.vercel.sh/v1}

server:
  port: ${PORT:8080}

app:
  release-id: ${RELEASE_ID:}
